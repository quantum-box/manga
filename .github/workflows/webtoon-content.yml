name: Webtoon content
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/test_windowed_reader.cjs
      - run: python scripts/sync_ios_webtoons.py --check
  ios-catalog:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test real device path aliases and bundled readers
        run: |
          swiftc ios/Manga/Sources/Catalog.swift scripts/test_ios_catalog.swift -o "$RUNNER_TEMP/catalog-tests"
          "$RUNNER_TEMP/catalog-tests"
          swiftc ios/Manga/Sources/Catalog.swift scripts/test_remote_catalog.swift -o "$RUNNER_TEMP/remote-tests"
          "$RUNNER_TEMP/remote-tests"
          swiftc ios/Manga/Sources/Catalog.swift scripts/test_offline_downloads.swift -o "$RUNNER_TEMP/offline-tests"
          "$RUNNER_TEMP/offline-tests"
          swiftc ios/Manga/Sources/Catalog.swift scripts/test_reading_history.swift -o "$RUNNER_TEMP/history-tests"
          "$RUNNER_TEMP/history-tests"
          swiftc ios/Manga/Sources/Catalog.swift scripts/test_reader_content.swift -o "$RUNNER_TEMP/reader-content-tests"
          "$RUNNER_TEMP/reader-content-tests"
