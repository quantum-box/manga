<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>塔を灯す剣｜第1話</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#e5e9ee;color:#273347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{width:100%;max-width:640px;margin:auto;background:white;container-type:inline-size}header{padding:42px 22px 32px;text-align:center;background:#fff}header a,footer a{color:#365178;text-decoration:none;font-size:16px}header p{font-size:16px;margin:24px 0 10px;letter-spacing:.12em}h1{font-size:28px;line-height:1.5;margin:0}figure{margin:0}figure img{display:block;width:100%;height:auto}.gap{height:var(--gap);background:white}footer{padding:45px 24px;text-align:center;display:flex;gap:24px;justify-content:center}footer a{font-size:18px}a:focus-visible{outline:3px solid #d98238;outline-offset:4px}</style><main><header><a href="../chapters.html">話一覧</a><p>塔を灯す剣 · 第1話</p><h1>この剣で、一緒に</h1></header>
<figure id="scene-01"><img src="art/r01-monitor.png" width="724" height="2172" alt="冒険の外側。現実の海斗の部屋、夜。机にPCとVR端末。。メッセージ「剣、ありがとう！」 海斗「俺も、行きたかったな。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:28.205cqw"></div>
<figure id="scene-02"><img src="art/r02.png" width="724" height="2172" alt="塔のある世界。同じ部屋からVRログイン。リューメルの広場。。海斗「今度は、俺も。」 HUD「ログイン完了」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:25.641cqw"></div>
<figure id="scene-03"><img src="art/r03.png" width="724" height="2172" alt="向かう先。広場から工房への一つの通り。晴れたゲーム内の午後。。カイ「昨日の剣、どうだったかな。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:17.949cqw"></div>
<figure id="scene-04"><img src="art/r04-created.png" width="724" height="2172" alt="帰ってきた剣。青い布の扉がある工房。木の作業台を挟み、カイは左、セナは右。。セナ「カイ、今いい？」 カイ「セナさん。おかえり。」 セナ「カイが作った剣、使ってみたよ。」 カイ「……どうだった？」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:23.077cqw"></div>
<figure id="scene-05"><img src="art/r05.png" width="724" height="2172" alt="嬉しい言葉、その続き。同じ作業台。青い布の扉と、一本だけの試作剣。。セナ「すごく振りやすい。」 セナ「でも、三回目が出ない。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:25.641cqw"></div>
<figure id="scene-06"><img src="art/r06.png" width="724" height="2172" alt="三回目の前で。工房の裏口から隣接する石の試験庭。木の標的一つ。。セナ「ここなら、安全に試せる。」 セナ「一回目。」 セナ「二回目。」 セナ「……ここで止まる。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:30.769cqw"></div>
<figure id="scene-07"><img src="art/r07.png" width="724" height="2172" alt="失敗を見たあと。同じ試験庭の壁際。セナ右、カイ左。。カイ「ごめん。」 セナ「折れてないよ。」 カイ「でも、戦ってる時なら……。」 セナ「じゃあ、ここで確かめよう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:20.513cqw"></div>
<figure id="scene-08"><img src="art/r08.png" width="724" height="2172" alt="どこで止まるのか。庭から工房へ戻る。同じ台、試作剣はカイの前。。カイ「少し、開けてもいい？」 セナ「うん。」 カイ「刃じゃない……。」 カイ「熱の逃げ道が、詰まってる。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:20.513cqw"></div>
<figure id="scene-09"><img src="art/r09.png" width="724" height="2172" alt="直す理由。同じ台と同じ一振り。台に置いた蓋と工具。。セナ「熱？」 カイ「光を出すと、ここが熱くなる。」 カイ「逃げないと、止まる。」 音「カチ」 カイ「もう一回、試そう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:25.641cqw"></div>
<figure id="scene-10"><img src="art/r10.png" width="724" height="2172" alt="持つ人が変わる。同じ裏口から同じ試験庭。標的一つ、盾は同じベンチ。。セナ「今度は、カイが振って。」 カイ「俺、うまくないけど。」 セナ「ゆっくりでいいよ。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:25.641cqw"></div>
<figure id="scene-11"><img src="art/r11.png" width="724" height="2172" alt="二回、そして。同じ試験庭。カイが標的の右、セナは後ろで見守る。。音「コン」 音「コン」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:48.718cqw"></div>
<figure id="scene-12"><img src="art/r12.png" width="724" height="2172" alt="あと一撃が出た。同じ標的への三打目。。音「コン」 セナ「出た。」 カイ「……よかった。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:38.462cqw"></div>
<figure id="scene-13"><img src="art/r13.png" width="724" height="2172" alt="誘いの意味。同じ試験庭、夕方へ。カイの手に一本の試作剣。。セナ「明日、塔に行かない？」 カイ「修理係で？」 セナ「一緒に、戦いに。」 カイ「この剣で、行っていい？」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:43.590cqw"></div>
<figure id="scene-14"><img src="art/r14.png" width="724" height="2172" alt="一緒に登る約束。試験庭、工房と塔が同じ方向に見える。夕方の暖かな光。。セナ「うん。待ってる。」 カイ「……うん。行く。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
