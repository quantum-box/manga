<figure id="scene-01"><img src="art/01.png" width="887" height="1774" alt="もう少しだけ。旧水路の格子門前、安全な石の踊り場。カイ「もう少し、出せる。」 カイ「逃がす分を、減らせば。」 イリス「試験は？」 カイ「次の一撃だけ。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-02"><img src="art/02.png" width="887" height="1774" alt="熱の戻り。同じ水路の門を抜けた先、小型守護機が一体。セナ「行ける？」 音「パチッ」 カイ「止まった……！」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:8.974cqw"></div>
<figure id="scene-03"><img src="art/03-continuity.png" width="887" height="1774" alt="帰る判断。同じ場所から帰還門へ後退。セナ「剣を下げて！」 イリス「退路、開ける！」 カイ「……俺が、変えた。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:35.897cqw"></div>
<figure id="scene-04"><img src="art/04-inactive.png" width="887" height="1774" alt="隠さない。安全な帰還門の踊り場、同じ遠征の終わり。カイ「出力を、上げたかった。」 セナ「次は、先に聞かせて。」 カイ「……ごめん。」 イリス「持ち帰って、調べよう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
