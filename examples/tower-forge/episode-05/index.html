<figure id="scene-01"><img src="art/01.png" width="724" height="2172" alt="分解する朝。街のオルンの工房、次のログインの昼。オルン「よく、戻ってきた。」 カイ「ここを締めた。」 オルン「逃がす道が、ない。」 カイ「熱も、ためたのか。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-02"><img src="art/02.png" width="724" height="2172" alt="記録を合わせる。同じ机。魔石と紙の記録。イリス「私の魔法も、強すぎた。」 セナ「弱くても、続けばいい。」 カイ「一撃ごとに、冷やそう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:17.949cqw"></div>
<figure id="scene-03"><img src="art/03.png" width="724" height="2172" alt="作り直す。同じ工房の作業台。音「カチ」 オルン「試験を、忘れるな。」 カイ「見てて。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-04"><img src="art/04.png" width="724" height="2172" alt="同じ間隔。工房の石の試験庭、前話の木製標的とは別の健全な標的。セナ「一回、待って。」 音「しゅう」 イリス「同じ出力、保てた。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
