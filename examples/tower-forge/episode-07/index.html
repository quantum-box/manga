<figure id="scene-01"><img src="art/01.png" width="724" height="2172" alt="先に来た攻略者。守護者の部屋の手前、安全な観察台。ヴェイン「回収の依頼か。」 カイ「蓄積環が、必要なんだ。」 ヴェイン「胸を割れば、すぐ終わる。」 セナ「それじゃ、残らない。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-02"><img src="art/02.png" width="724" height="2172" alt="違う目的。同じ観察台、石柱が位置の目印。ヴェイン「俺の隊は、先で待ってる。」 カイ「俺たちは、持ち帰りたい。」 ヴェイン「なら、別でやろう。」 セナ「決まったね。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:23.077cqw"></div>
<figure id="scene-03"><img src="art/03-door.png" width="725" height="2170" alt="固定具を探す。観察台から守護者を望む。まだ戦闘は始めない。イリス「開く瞬間が、ある。」 カイ「固定具だけ、切ろう。」 セナ「倒れたら、私が支える。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-04"><img src="art/04-door.png" width="724" height="2172" alt="条件をそろえる。同じ観察台の出口。イリス「水路も、戻したい。」 カイ「熱が下がったら、行く。」 セナ「始めよう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
