<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第25話 できない日の仕事｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第25話 できない日の仕事</h1></header><figure id="scene-01" data-artwork="art/01-season.webp" style="--after:52.77778cqw"><img src="art/01-season.webp" width="887" height="1774" alt="冷たい朝、ポチが鼻をくしゃみで揺らし、布袋を嗅いでも反応できない。PO内心：鼻、休業だ。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:44.44444cqw"><img src="art/02.webp" width="887" height="1774" alt="ミラがポチの元気と歩き方を確かめ、暖かい部屋を用意する。PR：今日は中にいよう。／PO内心：また休みか。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:58.33333cqw"><img src="art/03.webp" width="887" height="1774" alt="ポチが扉へ行こうとして戻り、毛布へ座る。PO内心：においが薄い。／PR：無理しないで。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:33.33333cqw"><img src="art/04.webp" width="887" height="1774" alt="大工が点検の人数を数え、ポチ抜きで低い土台も確認する。大工：下も忘れるな。／職人：かがんで見る。"></figure>
<figure id="scene-05" data-artwork="art/05-room.webp" style="--after:50.00000cqw"><img src="art/05-room.webp" width="887" height="1774" alt="トトが犬用の水器を近くへ置き、布で濡れた鼻の周りを軽く拭く。TO：ここにいるよ。／PO内心：助けられる日か。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:47.22222cqw"><img src="art/06.webp" width="887" height="1774" alt="ミラが作業の進みを部屋で説明し、ポチが目で図を追う。PR：土台は終わった。／PO内心：話は分かるぞ。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:69.44444cqw"><img src="art/07.webp" width="887" height="1774" alt="ポチが窓辺で職人の呼ぶ声を聞き、耳をそちらへ向ける。職人：縄を持ってきて。／PO内心：耳は営業中。"></figure>
<figure id="scene-08" data-artwork="art/08-room.webp" style="--after:52.77778cqw"><img src="art/08-room.webp" width="887" height="1774" alt="トトが声に気づかず、ポチが軽く鳴いて窓を見上げる。PO：ワン！／TO：あ、呼んでる。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:41.66667cqw"><img src="art/09.webp" width="887" height="1774" alt="トトが大人へ伝えに出て、ポチは部屋で待つ。TO：ミラに言ってくる。／PO内心：これで十分だ。"></figure>
<figure id="scene-10" data-artwork="art/10-final.webp" style="--after:150.00000cqw"><img src="art/10-final.webp" width="887" height="1774" alt="夜、魔王が戸口へ顔を出し、ポチの毛布を見て静かに引く。DK：今日は休め。／PO内心：命令でも嬉しい。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-24/index.html">前の話</a> <a href="../episode-26/index.html">次の話</a></nav><p>第25話 おわり</p></footer></main></body></html>
