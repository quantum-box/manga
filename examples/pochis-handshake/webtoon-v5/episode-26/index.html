<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第26話 先に決める約束｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第26話 先に決める約束</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:27.77778cqw"><img src="art/01.webp" width="887" height="1774" alt="数日後、ポチの鼻が戻り、修理された土台をミラと見に行く。PR：元気が戻ったね。／PO内心：鼻も復帰だ。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:41.66667cqw"><img src="art/02.webp" width="887" height="1774" alt="大工が新しい梁を指し、本水路はまだ閉じたままだと確認する。大工：流すのは明日だ。／DK：点検が先だ。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:55.55556cqw"><img src="art/03.webp" width="887" height="1774" alt="村長が試験の量を問い、ミラが目盛り一つ分の図を示す。村長：どれだけ流す？／PR：最初はこの線。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:44.44444cqw"><img src="art/04.webp" width="887" height="1774" alt="魔王が水門を操作する人と合図を受ける人を分ける。DK：開けるのは俺。／大工：止めるのは全員だ。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:38.88889cqw"><img src="art/05.webp" width="887" height="1774" alt="ミラが赤い布の旗を持ち、声が聞こえない場所の合図を見せる。PR：赤で止める。／職人：見えます。"></figure>
<figure id="scene-06" data-artwork="art/06-final.webp" style="--after:63.88889cqw"><img src="art/06-final.webp" width="887" height="1774" alt="トトが試験場へ行きたいと言い、村長が村の安全な丘の役割を示す。TO：ぼくも見たい。／村長：村の人数を数えて。"></figure>
<figure id="scene-07" data-artwork="art/07-final.webp" style="--after:41.66667cqw"><img src="art/07-final.webp" width="887" height="1774" alt="村の丘でトトが家々の人を呼び、空いた家の戸口を確かめる。TO：ここに集まって。／村人：家は空だよ。"></figure>
<figure id="scene-08" data-artwork="art/08-continuity-final.webp" style="--after:44.44444cqw"><img src="art/08-continuity-final.webp" width="887" height="1774" alt="城でポチが試しの吠え声を上げ、旗が上がり魔王が手を止める。PO：ワン！／DK：聞こえた。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:52.77778cqw"><img src="art/09.webp" width="887" height="1774" alt="大工がすべての固定具を一本ずつ指し、ミラが図に印を付ける。大工：飛ばすなよ。／PR：一本ずつね。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:147.22222cqw"><img src="art/10.webp" width="887" height="1774" alt="夕方、点検後の静かな水路を見てポチが怖さを感じる。PO内心：明日、流れる。／PR：怖くても止めていい。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-25/index.html">前の話</a> <a href="../episode-27/index.html">次の話</a></nav><p>第26話 おわり</p></footer></main></body></html>
