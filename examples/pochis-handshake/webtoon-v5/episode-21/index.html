<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第21話 魔王の空いた椅子｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第21話 魔王の空いた椅子</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:38.88889cqw"><img src="art/01.webp" width="887" height="1774" alt="翌朝の村で水が戻り、村長が共同点検の会議を提案する。村長：城の人も呼ぼう。／PR：私が誘う。"></figure>
<figure id="scene-02" data-artwork="art/02-corrected.webp" style="--after:50.00000cqw"><img src="art/02-corrected.webp" width="887" height="1774" alt="城でミラが魔王へ村の招待を伝え、魔王が角に触れる。DK：俺が村へ？／PR：無理はしなくていい。"></figure>
<figure id="scene-03" data-artwork="art/03-text.webp" style="--after:27.77778cqw"><img src="art/03-text.webp" width="887" height="1774" alt="魔王が城の水門を職人へ引き継ぎ、操作の線を確かめる。DK：この線を守れ。／職人：交代できます。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:41.66667cqw"><img src="art/04.webp" width="887" height="1774" alt="森道で魔王が歩幅を落とし、ポチの速度に合わせる。DK：遅いな。／PO内心：合わせてるだろ。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:72.22222cqw"><img src="art/05.webp" width="887" height="1774" alt="村の入口でトトが驚き、魔王は距離を取って立ち止まる。TO：本当に角だ！／DK：近づくな。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:40.27778cqw"><img src="art/06.webp" width="887" height="1774" alt="ミラがトトへ挨拶から始めようと促し、トトが頭を下げる。TO：こんにちは。／DK：……こんにちは。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:50.00000cqw"><img src="art/07.webp" width="887" height="1774" alt="村の会議室で低い梁を見上げた魔王が角を避けてかがむ。村長：こちらの席へ。／PO内心：王も頭を下げる。"></figure>
<figure id="scene-08" data-artwork="art/08-continuity.webp" style="--after:61.11111cqw"><img src="art/08-continuity.webp" width="887" height="1774" alt="空いた椅子へ魔王が座り、村人が少し離れた椅子を動かす。DK：ここでいい。／村人：話を聞こう。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:38.88889cqw"><img src="art/09.webp" width="887" height="1774" alt="村長と魔王が雨の日の桶と水門の線を同じ机へ置く。村長：村ではこれだけ。／DK：城ではこうだ。"></figure>
