<figure id="scene-02" style="margin-bottom:100px"><img src="art/02-daylight.webp" width="887" height="1774" alt="手の置き方。DK：怪我はないな。／PO内心：助けてくれた。"></figure>
<figure id="scene-03" style="margin-bottom:45px"><img src="art/03.webp" width="887" height="1774" alt="言い直す。PR：水門の理由、見ました。／PR：知らずに来て、ごめんなさい。"></figure>
<figure id="scene-04" style="margin-bottom:90px"><img src="art/04.webp" width="887" height="1774" alt="守るための閉鎖。DK：開けば村を押し流す。／PO内心：止めて守ったんだ。"></figure>
<figure id="scene-05" style="margin-bottom:95px"><img src="art/05.webp" width="887" height="1774" alt="なぜ話さなかった。PR：村へ知らせましたか。／DK：剣を向けられた。"></figure>
<figure id="scene-06" style="margin-bottom:45px"><img src="art/06.webp" width="887" height="1774" alt="疑う理由。DK：話す前に、敵だと。／PO内心：狼と同じだ。／PR：今日は話をしに。"></figure>
<figure id="scene-07" style="margin-bottom:110px"><img src="art/07.webp" width="887" height="1774" alt="一人でやっていた。PR：ずっと一人で？／DK：他に手がない。"></figure>
<figure id="scene-08" style="margin-bottom:100px"><img src="art/08.webp" width="887" height="1774" alt="すぐ触らない。PO内心：近づいてみる。"></figure>
<figure id="scene-09" style="margin-bottom:45px"><img src="art/09.webp" width="887" height="1774" alt="できることを聞く。PR：何が足りませんか。／DK：手が二つ。別々の場所だ。"></figure>
<figure id="scene-10" style="margin-bottom:110px"><img src="art/10.webp" width="887" height="1774" alt="手伝わせて。PR：私が片方を。／PO内心：俺は、何ができる？／DK：まず、試す。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-06/index.html">前の話</a> <a href="../episode-08/index.html">次の話</a></nav><p>第7話 おわり</p></footer></main></body></html>
