<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第29話 水を待つ場所｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第29話 水を待つ場所</h1></header><figure id="scene-01" data-artwork="art/01-continuity-final.webp" style="--after:47.22222cqw"><img src="art/01-continuity-final.webp" width="887" height="1774" alt="朝の城と村、それぞれが昨日と同じ安全な位置へ集まる。PR：人数はそろった？／村長：村はそろった。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:41.66667cqw"><img src="art/02.webp" width="887" height="1774" alt="魔王が本水路の門を一目盛りだけ開け、職人が低い水路も確認する。DK：一目盛り。／職人：迂回も通ってます。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:61.11111cqw"><img src="art/03.webp" width="887" height="1774" alt="ポチと大工が継ぎ目を下から見て、今回は滴がないと確かめる。大工：漏れていない。／PO内心：目も鼻も、よし。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:233.33333cqw"><img src="art/04.webp" width="887" height="1774" alt="ミラが白い旗で維持を知らせ、魔王は水量を増やさず手を離す。PR：このまま待とう。／DK：線は守る。"></figure>
<figure id="scene-05" data-artwork="art/05-continuity-final.webp" style="--after:69.44444cqw"><img src="art/05-continuity-final.webp" width="887" height="1774" alt="水が高い水路の村側へゆっくり届き、村長が丘から見る。村長：来た。／TO：水だ！"></figure>
<figure id="scene-06" data-artwork="art/06-continuity-final.webp" style="--after:47.22222cqw"><img src="art/06-continuity-final.webp" width="887" height="1774" alt="村長が安全な受け口へ大人だけ案内し、トトは丘で待つ。村長：今は大人だけ。／TO：ここで数える。"></figure>
<figure id="scene-07" data-artwork="art/07-continuity-final.webp" style="--after:52.77778cqw"><img src="art/07-continuity-final.webp" width="887" height="1774" alt="村人が受け口の線を測り、村長が記録板へ印を付ける。村人：線の内側です。／村長：城へ知らせよう。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:41.66667cqw"><img src="art/08.webp" width="887" height="1774" alt="青リボンの鳩が城へ飛び、ミラが手紙を受け取る。PR：村も確認できた。／PO内心：両方で、成功だ。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:47.22222cqw"><img src="art/09.webp" width="887" height="1774" alt="魔王が水門の交代を職人へ説明し、夜の担当を決める。DK：線を変えるな。／職人：夜は私が見ます。"></figure>
