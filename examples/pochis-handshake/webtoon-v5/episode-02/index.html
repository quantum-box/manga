<figure id="scene-02" style="margin-bottom:85px"><img src="art/02.webp" width="887" height="1774" alt="届かない説明。PO内心：人を呼ぶよ。／PO発声：ワン！／TO：怒らないで。／PO内心：違うんだよ。"></figure>
<figure id="scene-03" style="margin-bottom:110px"><img src="art/03-continuity.webp" width="887" height="1774" alt="そばにいる。TO：ひとりにしないで。／PO内心：怖かったよな。"></figure>
<figure id="scene-04" style="margin-bottom:55px"><img src="art/04.webp" width="887" height="1774" alt="探している人。PR画面外：トトー！／TO：ミラ姉ちゃん！／PO内心：呼んでくる。"></figure>
<figure id="scene-05" style="margin-bottom:45px"><img src="art/05.webp" width="887" height="1774" alt="追いかけてほしい。PO発声：ワン！／PR：迷子なの？／PO内心：俺じゃない！"></figure>
<figure id="scene-06" style="margin-bottom:45px"><img src="art/06.webp" width="887" height="1774" alt="裾を引く。PR：そっちなの？／PR：案内して。"></figure>
<figure id="scene-07" style="margin-bottom:100px"><img src="art/07.webp" width="887" height="1774" alt="場所が伝わる。PR：トト！／TO：ここ！／PO内心：通じた。"></figure>
<figure id="scene-08" style="margin-bottom:60px"><img src="art/08.webp" width="887" height="1774" alt="力を合わせる。PR：ゆっくり抜いて。／TO：抜けた！"></figure>
<figure id="scene-09" style="margin-bottom:125px"><img src="art/09.webp" width="887" height="1774" alt="助けたあと。PR：歩ける？／TO：うん。／PO内心：今ごろ震えが。"></figure>
<figure id="scene-10" style="margin-bottom:110px"><img src="art/10.webp" width="887" height="1774" alt="一緒に帰ろう。PR：君も、来る？／PO内心：ひとりよりいい。／TO：犬も家に帰る！"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-01/index.html">前の話</a> <a href="../episode-03/index.html">次の話</a></nav><p>第2話 おわり</p></footer></main></body></html>
