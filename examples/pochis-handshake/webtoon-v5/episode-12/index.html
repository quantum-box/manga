<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第12話 小さな声の行き先｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第12話 小さな声の行き先</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:12.50000cqw"><img src="art/01.webp" width="887" height="1774" alt="家の戸口でポチが耳を立て、トトが庭の柵の隙間を見つける。TO：羊がいない。／PO内心：あの声か。"></figure>
<figure id="scene-02" data-artwork="art/02-group.webp" style="--after:25.00000cqw"><img src="art/02-group.webp" width="887" height="1774" alt="年配の羊飼いが小さな鈴を示し、ミラが村人へ捜索を知らせる。羊飼い：白い子なんだ。／PR：みんなで行こう。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:19.44444cqw"><img src="art/03.webp" width="887" height="1774" alt="ポチが柵の白い毛を嗅ぎ、土の蹄跡を見つける。PO内心：鼻、仕事だぞ。／TO：ここから？"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:38.88889cqw"><img src="art/04.webp" width="887" height="1774" alt="トトが森へ走ろうとし、ミラが横に立って一緒に歩く。PR：ひとりはだめ。／TO：うん、待つ。"></figure>
<figure id="scene-05" data-artwork="art/05-one-head.webp" style="--after:61.11111cqw"><img src="art/05-one-head.webp" width="887" height="1774" alt="分かれ道で多くの匂いにポチが混乱し、立ち止まる。PO内心：全部におう！／PR：急がなくていい。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:233.33333cqw"><img src="art/06.webp" width="887" height="1774" alt="ポチが休んで耳を澄ませ、左の草むらから鈴の音を聞く。PO内心：あっちだ。"></figure>
<figure id="scene-07" data-artwork="art/07-observe.webp" style="--after:41.66667cqw"><img src="art/07-observe.webp" width="887" height="1774" alt="草をかき分けた先で白い子羊の脚が根に挟まっていると分かる。TO：いた！／PR：近づかないで。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:22.22222cqw"><img src="art/08.webp" width="887" height="1774" alt="ミラと羊飼いが根を持ち上げ、トトとポチは安全な場所で待つ。羊飼い：今、外すよ。／PO内心：任せる役もある。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:66.66667cqw"><img src="art/09.webp" width="887" height="1774" alt="自由になった子羊が母羊のいる柵へ戻り、ポチが追わず見守る。TO：追いかけないの？／PO内心：あいつの家だ。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:116.66667cqw"><img src="art/10.webp" width="887" height="1774" alt="母羊に寄り添う子羊の横で、羊飼いが破れた柵を指す。羊飼い：直さないとな。／PO内心：助けた後も、か。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-11/index.html">前の話</a> <a href="../episode-13/index.html">次の話</a></nav><p>第12話 おわり</p></footer></main></body></html>
