<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第24話 森の隣人｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第24話 森の隣人</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:38.88889cqw"><img src="art/01.webp" width="887" height="1774" alt="修理材を運ぶ道でポチが灰色の毛を見つけ、ミラを見上げる。PO内心：あいつのにおい。／PR：立ち止まろう。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:63.88889cqw"><img src="art/02.webp" width="887" height="1774" alt="森の奥から首輪のない灰狼が現れ、人と犬を遠くから見る。PO内心：元気だったか。／PR：追わないで。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:47.22222cqw"><img src="art/03.webp" width="887" height="1774" alt="大工が狼のいる近道を指し、ミラが荷車を止める。大工：通れるか？／PR：別の道を見よう。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:66.66667cqw"><img src="art/04.webp" width="887" height="1774" alt="ポチが一歩寄ろうとし、狼が低く唸って後退する。PO内心：挨拶、まだだな。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:33.33333cqw"><img src="art/05.webp" width="887" height="1774" alt="ミラと大工が荷車を広い道へ戻し、ポチもついて歩く。PR：ここは譲ろう。／PO内心：友達でも距離。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:52.77778cqw"><img src="art/06.webp" width="887" height="1774" alt="広い道の崩れた端を大工が確かめ、荷車を内側へ寄せる。大工：右を空けろ。／PR：足元を見て。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:69.44444cqw"><img src="art/07.webp" width="887" height="1774" alt="狼が高い岩から荷車を見守り、ポチは視線だけ返す。PO内心：ついて来なくていい。／PO内心：見てるだけか。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:44.44444cqw"><img src="art/08.webp" width="887" height="1774" alt="城の門で魔王が運搬路を聞き、森の地図へ印を付ける。DK：そこは巣の近くだ。／PR：次も避けよう。"></figure>
<figure id="scene-09" data-artwork="art/09-final.webp" style="--after:36.11111cqw"><img src="art/09-final.webp" width="887" height="1774" alt="大工が地図の迂回路を職人へ渡し、作業時間を組み直す。大工：遠くても安全だ。／職人：早く出よう。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:136.11111cqw"><img src="art/10.webp" width="887" height="1774" alt="夕暮れの森で狼は自分の道へ去り、ポチが城の門へ戻る。PO内心：またな、隣人。／DK：帰るぞ。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-23/index.html">前の話</a> <a href="../episode-25/index.html">次の話</a></nav><p>第24話 おわり</p></footer></main></body></html>
