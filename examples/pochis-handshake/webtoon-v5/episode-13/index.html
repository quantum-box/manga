<figure id="scene-05" data-artwork="art/05.webp" style="--after:52.77778cqw"><img src="art/05.webp" width="887" height="1774" alt="ポチが鼻先を手に寄せ、トトが首の横を軽く撫でる。TO：やわらかい。／PO内心：悪くないな。"></figure>
