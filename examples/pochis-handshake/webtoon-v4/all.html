08"><small>転生したら柴犬だった。</small><h1>第8話 一人では直せない</h1></header><figure style="margin-bottom:90px"><img src="episode-08/art/01.png" alt="魔王:古い水路へ切り替える。|魔王:この二つを、同時に動かす。"></figure><figure style="margin-bottom:120px"><img src="episode-08/art/02.png" alt="魔王:一人では届かない。|魔王:使者は剣を抜いた。話にならぬ。"></figure><figure style="margin-bottom:65px"><img src="episode-08/art/03-lettering.png" alt="姫:私は、戦いに来ていません。|姫:留め具を直します。教えてください。"></figure><figure style="margin-bottom:130px"><img src="episode-08/art/04-practice.png" alt="魔王:まず、この留め方だ。|姫:できた。|ポチ内心:ちゃんと、話が進んでる。"></figure><header id="episode-09"><small>転生したら柴犬だった。</small><h1>第9話 できることをする</h1></header><figure style="margin-bottom:25px"><img src="episode-09/art/01-dialogue.png" alt="魔王:合図するまで回すな。|姫:はい。|ポチ内心:俺は、ここで待つ。"></figure><figure style="margin-bottom:25px"><img src="episode-09/art/02.png" alt="ポチ内心:足元、動いてる！|ポチ発声:ワン！|姫:どうしたの？"></figure><figure style="margin-bottom:80px"><img src="episode-09/art/03.png" alt="姫:止めます！|魔王:その石床へ！|姫:教えてくれて、ありがとう。|ポチ発声:ワン"></figure><figure style="margin-bottom:150px"><img src="episode-09/art/04.png" alt="姫:固定できました。|魔王:……よし。|ポチ内心:待つのも、仕事だ。"></figure><header id="episode-10"><small>転生したら柴犬だった。</small><h1>第10話 おてから始まる</h1></header><figure style="margin-bottom:70px"><img src="episode-10/art/01-channel.png" alt="魔王:少しずつ、開ける。|姫:水路、持っています！"></figure><figure style="margin-bottom:160px"><img src="episode-10/art/02-village.png" alt="子供:水だ！|姫:村に、届きました。"></figure><figure style="margin-bottom:210px"><img src="episode-10/art/03.png" alt="魔王:お前にも、礼を言う。|ポチ内心:この人の手も、怖くない。"></figure><figure style="margin-bottom:180px"><img src="episode-10/art/04.png" alt="ポチ内心:よろしく。|姫:握手、ですね。|魔王:……もう一回。|ポチ発声:ワン！"></figure><footer><a href="chapters.html">話一覧へ</a></footer></main>
