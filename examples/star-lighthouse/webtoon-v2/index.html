<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c18">
  <title>星を拾う夜 — SF縦読み短編</title>
  <style>
    :root { color-scheme: dark; --space:#080c18; --paper:#f4f9fc; --cyan:#a9e9f5; }
    * { box-sizing:border-box; }
    html { background:var(--space); }
    body { margin:0; color:var(--paper); font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
    .episode { width:100%; max-width:480px; margin:0 auto; container-type:inline-size; }
    .title { padding:70px 20px 44px; text-align:center; }
    .kicker { margin:0 0 18px; color:#9fc4d5; font-size:12px; letter-spacing:.2em; }
    h1 { margin:0; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:clamp(30px,8.7cqw,40px); font-weight:500; letter-spacing:.13em; }
    .hint { margin:26px 0 0; color:#8799af; font-size:11px; letter-spacing:.12em; }
    .hint::after { content:""; display:block; width:1px; height:25px; margin:11px auto 0; background:linear-gradient(#8cb9d1,transparent); }
    .line { margin:0; font-size:clamp(19px,5.1cqw,23px); line-height:1.7; letter-spacing:.025em; }
    .opening { margin:0 8% 26px; }
    .scene { position:relative; margin:0; }
    .scene img { display:block; width:100%; height:auto; }
    .watch img { mask-image:linear-gradient(#000 95%,transparent); }
    .signal { margin-top:clamp(100px,32cqw,154px); }
    .signal img { mask-image:linear-gradient(transparent,#000 3%,#000 97%,transparent); }
    .bubble { position:absolute; z-index:1; margin:0; padding:.65em 1em; color:#14222d; background:var(--paper); border-radius:48%; font-size:clamp(19px,5.1cqw,23px); line-height:1.65; letter-spacing:.01em; white-space:nowrap; filter:drop-shadow(0 2px 2px #0003); }
    .bubble::after { content:""; position:absolute; left:23%; bottom:-.45em; width:1em; height:.75em; background:var(--paper); clip-path:polygon(0 0,100% 0,12% 100%); }
    .question { top:22%; right:8%; }
    .question::after { left:18%; transform:rotate(120deg); bottom:auto; top:-.3em; }
    .sound { position:absolute; margin:0; color:var(--cyan); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:clamp(25px,7cqw,32px); letter-spacing:.14em; text-shadow:0 0 16px #14233a; }
    .ping { top:7%; right:13%; }
    .calf { margin-top:clamp(320px,105cqw,504px); }
    .calf img { mask-image:linear-gradient(transparent,#000 5%,#000 93%,transparent); }
    .lost { top:4%; left:9%; }
    .lost::after { left:9%; transform:rotate(30deg); }
    .silence { position:relative; margin:0; }
    .listen-silence { height:clamp(320px,110cqw,528px); }
    .depth-silence { height:clamp(460px,160cqw,768px); }
    .reply-line { padding:58px 9% 26px; }
    .reply { width:94%; margin:0 auto 28px; }
    .reply img { mask-image:linear-gradient(transparent,#000 3%,#000 94%,transparent); }
    .parent img { mask-image:linear-gradient(transparent,#000 2%,#000 98%,transparent); }
    .reveal-marker { position:absolute; top:45%; width:1px; height:1px; pointer-events:none; }
    .heartbeat { top:22%; left:43%; color:#a0d3e7; opacity:.65; font-size:clamp(23px,6.5cqw,30px); writing-mode:vertical-rl; transform:rotate(-3deg); }
    .farewell { margin-top:clamp(180px,65cqw,312px); }
    .farewell img { mask-image:linear-gradient(transparent,#000 4%,#000 91%,transparent); }
    .goodbye { top:49%; right:7%; font-size:clamp(19px,5.1cqw,23px); border-radius:45%; white-space:normal; text-align:center; }
    .goodbye::after { left:12%; transform:rotate(25deg); }
    .log { margin:clamp(260px,90cqw,432px) 9% 0; padding:25px 0 0; border-top:1px solid #43637c; }
    .log-label { color:#8caabc; font-size:11px; letter-spacing:.2em; margin:0 0 18px; }
    .log .line + .line { margin-top:76px; color:var(--cyan); }
    .end { text-align:center; padding:90px 20px 150px; color:#8b9bad; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:15px; letter-spacing:.28em; }
    @media(min-width:600px) { .episode { box-shadow:0 0 90px #0005; } }
  </style>
</head>
<body>
  <main class="episode" aria-label="SF縦読み短編 星を拾う夜">
    <header class="title">
      <p class="kicker">宇宙灯台07 ／ 当直記録</p>
      <h1>星を拾う夜</h1>
      <p class="hint">下へスクロール</p>
    </header>
    <p class="line opening">今日も、来航ゼロ。</p>
    <figure class="scene watch">
      <img src="art/01-watch.png" width="1254" height="1254" alt="宇宙灯台の当直員ナギ。空のレーダーを見ていると、小さな青いランプに気づく。" fetchpriority="high">
    </figure>
    <figure class="scene signal">
      <img src="art/02-signal.png" width="724" height="2172" alt="窓から宇宙へ細い光が伸びる。下へ連なる青い信号をたどると、小さな光の点に近づく。">
      <p class="sound ping">ピ…</p>
      <p class="bubble question" id="signal-question">……救難信号？</p>
    </figure>
    <figure class="scene calf" id="calf-reveal">
      <img src="art/03-calf.png" width="1122" height="1402" alt="窓の外には、小さな青い宇宙クジラ。ナギが内側から手を添える。金色の目でこちらを見る。">
      <p class="bubble lost">……迷子か。</p>
    </figure>
    <div class="silence listen-silence" aria-hidden="true"></div>
    <p class="line reply-line" id="reply-question">返事が……下から。</p>
    <figure class="scene reply">
      <img src="art/04-answer.png" width="1254" height="1254" alt="ナギが耳を澄ませる。レーダーの下側に、大きな青い反応が現れる。">
    </figure>
    <div class="silence depth-silence">
      <p class="sound heartbeat" id="parent-heartbeat">どくん</p>
    </div>
    <figure class="scene parent">
      <img src="art/05-parent.png" width="724" height="2172" alt="小さな灯台から視線を下げると、宇宙を覆う巨大なクジラの顔が現れる。小さな子が、その額へ戻っていく。">
      <span class="reveal-marker" id="parent-reveal" aria-hidden="true"></span>
    </figure>
    <figure class="scene farewell">
      <img src="art/06-farewell.png" width="1024" height="1536" alt="大きな親と小さな子が宇宙を並んで遠ざかる。窓の内側で、ナギは穏やかに見送る。">
      <p class="bubble goodbye">また、迷ったら<br>おいで。</p>
    </figure>
    <section class="log" aria-label="最後の当直記録">
      <p class="log-label">当直記録 ／ 更新</p>
      <p class="line">来航、二頭。</p>
      <p class="line">異常なし。</p>
    </section>
    <footer class="end">おわり</footer>
  </main>
</body>
</html>
