<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剣聖、仇の弟子に転生する｜第1〜10話</title><style>
*{box-sizing:border-box}html{background:white;color:#26312c;color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}.book{width:100%;max-width:480px;margin:auto}nav{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fffffff0;backdrop-filter:blur(12px);border-bottom:1px solid #e8eeeb}button,select{font:inherit;font-size:14px;border:1px solid #d2ddd6;border-radius:8px;background:white;color:#304f3f;padding:10px;min-height:44px}select{min-width:0;flex:1}button:disabled{opacity:.35}iframe{display:block;width:100%;height:844px;border:0;background:white}footer{padding:30px 20px;text-align:center;font-size:14px}a{color:#365d49}
</style></head><body><main class="book"><nav aria-label="話を選ぶ"><button id="prev">← 前の話</button><select id="chapter" aria-label="話を選ぶ"></select><button id="next">次の話 →</button></nav><iframe id="reader" title="縦読み漫画の本文" scrolling="no"></iframe><footer><a id="direct">本文だけを開く</a></footer></main><script>
const chapters=[
{n:1,title:'知らない手',url:'episode-01-white-v3/index.html'},
{n:2,title:'掴めない手',url:'episode-02-white/index.html'},
{n:3,title:'一椀の粥',url:'episode-03-white/index.html'},
{n:4,title:'息をほどく',url:'episode-04-white/index.html'},
{n:5,title:'石段の下',url:'episode-05-white/index.html'},
{n:6,title:'門の外の風',url:'episode-06-white/index.html'},
{n:7,title:'斬らない剣',url:'episode-07-white/index.html'},
{n:8,title:'名のない墓',url:'episode-08-white/index.html'},
{n:9,title:'雨の針',url:'episode-09-white/index.html'},
{n:10,title:'守る手',url:'episode-10-white/index.html'}];
const select=document.getElementById('chapter'),frame=document.getElementById('reader'),prev=document.getElementById('prev'),next=document.getElementById('next');let observer;
for(const c of chapters){const option=document.createElement('option');option.value=c.n;option.textContent=`第${c.n}話　${c.title}`;select.append(option)}
function openChapter(n){const c=chapters[n-1];if(!c)return;select.value=n;frame.title=`第${n}話 ${c.title}`;frame.style.height='844px';frame.src=c.url;prev.disabled=n===1;next.disabled=n===10;document.getElementById('direct').href=c.url;history.replaceState(null,'','#'+n);window.scrollTo(0,0)}
frame.addEventListener('load',()=>{if(observer)observer.disconnect();try{const page=frame.contentDocument.querySelector('main');if(!page)return;const measure=()=>frame.style.height=Math.ceil(page.getBoundingClientRect().height)+'px';measure();observer=new ResizeObserver(measure);observer.observe(page)}catch{frame.style.height='90vh'}});
select.addEventListener('change',()=>openChapter(Number(select.value)));prev.addEventListener('click',()=>openChapter(Number(select.value)-1));next.addEventListener('click',()=>openChapter(Number(select.value)+1));const first=Number(location.hash.slice(1));openChapter(first>=1&&first<=10?first:1);
</script></body></html>
