</style><main class="episode"><header><p class="small">白嶺門 ／ 霜暦二一四年</p><h1>剣聖、<br>仇の弟子に<br>転生する</h1><p class="sub">第1話　その手は、二度目</p><p class="small">下へスクロール ↓</p></header>
<p class="line">剣聖と呼ばれた俺は、<br>この夜、死んだ。</p>
<figure class="scene"><img src="art/01-death.png" alt="白髪の剣聖を、顔の見えない男の剣が貫く"><p class="thought" style="top:72%;right:7%">俺を殺した手を、<br>忘れない。</p></figure>
<p class="line transition">……なのに。</p>
<figure class="scene"><img src="art/02-awake.png" alt="黒髪の少年として目覚め、震える手から木剣が落ちる"><p class="bubble" style="top:24%;right:6%">……軽い。</p><p class="thought" style="top:80%;right:5%">剣さえ、<br>握れない。</p><p class="sound" style="top:58%;left:7%">かたっ</p></figure>
<p class="label">白嶺門・末席の弟子　阿澄（あちょう）</p>
<figure class="scene steps"><img src="art/03-steps.png" alt="霜の軒、長い石段、近づく黒い靴。顔はまだ見えない"><p class="bubble" id="voice" style="top:4%;right:8%">阿澄。<br>立てるか。</p><p class="thought" id="question" style="top:16%;left:8%">この声……</p><p class="sound" style="top:58%;left:26%;writing-mode:vertical-rl">こつ</p><p class="sound" style="top:79%;right:14%;writing-mode:vertical-rl">こつ</p></figure>
<figure class="scene master" id="face-reveal"><img src="art/04-master.png" alt="沈玄の顔が初めて現れる。黒い髪と短い髭、緑の衣と黒い肩衣"><p class="thought" style="top:71%;left:7%">沈玄。<br>俺を殺した男。</p></figure>
<p class="line breath">今は、こいつの弟子か。<br><br>……なら、近づける。</p>
<p class="line">まず、この身体で<br>どこまで動ける？</p>
<figure class="scene technique"><img src="art/05-technique.png" alt="木剣の小さな一振りが紅葉を二つに割る。少年が軒の暗器に気づく"><p class="thought" style="top:16%;right:5%">身体が弱くても――</p><p class="thought" style="top:47%;right:5%">一寸だけなら。</p><p class="sound" style="top:65%;left:8%">すっ</p></figure>
<p class="line">まずい。<br>この剣筋を見られたら――</p>
<figure class="scene"><img src="art/06-shield.png" alt="落ちる針から師匠が少年をかばう。左腕に針が刺さる"><p class="bubble" style="top:14%;left:6%">伏せろ！</p><p class="sound" style="top:35%;right:6%">ざっ</p><p class="thought" style="top:85%;right:5%">なぜ……<br>俺を守る？</p></figure>
<p class="line breath">俺は、お前を<br>殺すつもりなのに。</p>
<figure class="scene"><img src="art/07-warning.png" alt="針が残った左腕。師匠が囁き、少年の目が見開かれる"><p class="bubble" style="top:29%;right:5%">その剣を、二度と<br>人前で使うな。</p><p class="bubble" style="top:62%;left:5%">今度こそ、<br>お前を死なせない。</p></figure>
<section class="ending"><p class="line">……<strong>今度こそ？</strong></p><footer>第1話 終 ／ 第2話へ続く</footer></section></main></html>
