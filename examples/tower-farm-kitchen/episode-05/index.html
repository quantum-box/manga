<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第5話 土は、点数じゃない｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第5話</p><h1>土は、点数じゃない</h1><small>13〜17日目</small></header><figure class="scene varied" id="01-yellow" style="--pause:20.51cqw"><img src="art/01-yellow.png" width="887" height="1774" alt="Balt and Kou beside one SMALL seedling section with yellowing leaves, nearby section greener; Balt feels leaf then checks soil, no idiot expression or huge mature forest. Closed fertilizer sack behind them. バルト「足りない色とは、限らん。」 コウ「水と土を、別々に調べたい。」"></figure><figure class="scene detail" id="02-samples" style="--pause:19.23cqw"><img src="art/02-samples-reading-order.png" width="887" height="1774" alt="Three closeups: Kou collects soil at matched depth in affected section, Balt collects normal section separately, two sealed sample jars and a third water sample kept apart. Jars have simple colored twine, no readable labels. コウ「同じ採り方で、比べよう。」 バルト「良い土と、混ぜるなよ。」"></figure><figure class="scene detail" id="03-calibration" style="--pause:23.08cqw"><img src="art/03-calibration-speaker-fixed.png" width="887" height="1774" alt="Iris at workshop table with fantasy conductivity probe in glass reference vessel, mechanical needle gauge and standard sample, Kou observes. No digital electronics. Two panels showing reference then sample, separate test steps, no invented numeric text. イリス「測り方が違えば、数字も違う。」 コウ「器具の基準も、確かめよう。」"></figure><figure class="scene conversation" id="04-salts" style="--pause:23.08cqw"><img src="art/04-salts-instrument-fixed.png" width="887" height="1774" alt="Medium Iris interprets matched samples, narrow closeup high versus lower needle position WITHOUT readable numbers, lower Elna worried holding closed fertilizer sack. No visible salt crystals sprouting from plant or magical x-ray. イリス「この区画は、塩類が多い。」 コウ「肥料にも、塩が含まれるんだ。」"></figure><figure class="scene varied" id="05-outlet" style="--pause:20.51cqw"><img src="art/05-outlet.png" width="887" height="1774" alt="Kou and Balt trace drainage outlet safely toward common channel, hand on site map with simple arrows, quiet conversation. Do not flush water through bed in this scene: they are checking capacity and destination first. コウ「薄める前に、排水先を調べる。」 バルト「流した分は、消えんからな。」"></figure><figure class="scene conversation" id="06-unknown-material" style="--pause:17.95cqw"><img src="art/06-unknown-material.png" width="887" height="1774" alt="Plain local trader offers CLOSED sack of powdered monster residue on utility lane far from food beds, Kou declines immediate use, Balt serious nearby. No corpse, gore, spreading powder, or instant fertilizer miracle. Three unequal panels. 商人「魔物の粉なら、効くぞ。」 コウ「何が入ってるか、まだ分からない。」 バルト「試すなら、食用の畑と分けろ。」"></figure><figure class="scene detail" id="07-stop-feeding" style="--pause:30.77cqw"><img src="art/07-stop-feeding.png" width="887" height="1774" alt="Closeup fertilizer sack stored closed on shelf, hand marks dated observation in notebook; lower Elna and Kou inspect unchanged seedling section and decide to wait. No instant green transformation, no flooding. コウ「今日は、足すのを止める。」 エルナ「変わるまで、記録しよう。」"></figure><figure class="scene continuous" id="08-open-diner" style="--pause:46.15cqw"><img src="art/08-open-diner.png" width="887" height="1774" alt="Tall soft transition from small slow-growing seedlings under tower light to diner serving window at dusk, Elna lights lantern, Kou brings PURCHASED basket. Warm anxious faces, continuous stable garden geography. エルナ「待ってる間にも、店は開く。」 コウ「畑だけじゃ、暮らせないな。」"></figure><footer><p>第5話 おわり</p><nav><a href="../episode-04/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-06/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
