<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2話 救える畝、残せない畝｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第2話</p><h1>救える畝、残せない畝</h1><small>2〜5日目</small></header><figure class="scene varied" id="01-morning" style="--pause:23.08cqw"><img src="art/01-morning.png" width="887" height="1774" alt="Same garden at early light, two unequal panels: Kou examines yesterday&#x27;s marked wilted plant still rooted, Elna behind him with empty watering can set down; closeup his cautious face and wet ground beginning to dry. No recovered jungle overnight. コウ「まだ、戻らないな。」 エルナ「待つのも、仕事？」"></figure><figure class="scene conversation" id="02-balt" style="--pause:17.95cqw"><img src="art/02-balt.png" width="887" height="1774" alt="Wide Balt arrives on walking path in brown hat; separate closeup Balt observing marked plant; lower Kou listens. Balt is experienced and practical, not foolish. Dug plant from yesterday lies separately and is not replanted alive. バルト「昨日と同じ株を見ろ。」 バルト「抜いた株は、元には戻らん。」"></figure><figure class="scene detail" id="03-compare" style="--pause:17.95cqw"><img src="art/03-compare.png" width="887" height="1774" alt="Overhead plot with one marked comparison strip and other rows; hand closeup tying plain twine marker without cutting roots; Elna looking from changed strip to remaining area. Plants vary realistically, no flashy transformation. コウ「この列だけ、別に記録する。」 エルナ「全部を、変えないの？」"></figure><figure class="scene detail" id="04-record" style="--pause:25.64cqw"><img src="art/04-record.png" width="887" height="1774" alt="Two unequal panels: Kou writes simple marks and blank spaces in notebook at plot edge; closeup Elna reading over shoulder. A subtle empty translucent recording frame may hover but NO added visible text or numerical claims. Notebook has sketch marks only. コウ「知らない数字は、空欄でいい。」 バルト「分かったことだけ、残せ。」"></figure><figure class="scene detail" id="05-new-roots" style="--pause:35.90cqw"><img src="art/05-new-roots-timed.png" width="887" height="1774" alt="Time has advanced to day five. Three panels: same twine marker and modestly less wilted plant, gentle root inspection showing a few NEW white fine roots amid remaining damaged roots, Balt&#x27;s restrained pleased expression. Recovery is partial, no instant glow or giant growth. コウ「新しい根だ。」 バルト「まだ弱い。急ぐな。」 時刻表示：五日目"></figure><figure class="scene hero" id="06-loss" style="--pause:46.15cqw"><img src="art/06-loss-cleared.png" width="887" height="1774" alt="Large quiet panel of bare damaged strip where dead plants have been removed, Elna kneeling with sad face; lower Kou quietly placing tray to plan new sowing. Do not fill dead area with new mature plants. エルナ「こっちは、戻らないのね。」 コウ「次の苗を、育てよう。」"></figure><figure class="scene varied" id="07-existing-harvest" style="--pause:19.23cqw"><img src="art/07-existing-harvest.png" width="887" height="1774" alt="Three unequal shots: Balt shows a surviving mature garden-leaf plant; Kou cuts usable leaves gently into clean shallow basket; Elna checks leaf size for kitchen. Source is surviving established plants, not seeds sown in this story. バルト「この葉は、若いうちが柔らかい。」 エルナ「切りやすい大きさが、欲しい。」"></figure><figure class="scene hero" id="08-dish" style="--pause:41.03cqw"><img src="art/08-dish-sequence-fixed.png" width="887" height="1774" alt="Warm kitchen: basket passed from Kou&#x27;s hands to Elna, narrow chopping closeup, large finished steaming dish at counter and their faces. Keep raw garden work off cooking surface. No magical buff display. エルナ「食べる人まで、畑の続きだね。」 コウ「来週の分も、作りたい。」"></figure><footer><p>第2話 おわり</p><nav><a href="../episode-01/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-03/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
