<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第6話 おいしいだけじゃ、店は続かない｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第6話</p><h1>おいしいだけじゃ、店は続かない</h1><small>18〜20日目</small></header><figure class="scene conversation" id="01-large-portion" style="--pause:20.51cqw"><img src="art/01-large-portion.png" width="887" height="1774" alt="Warm diner kitchen, Elna cheerfully adds extra food to guest bowl, Kou next to small ledger looks concerned but kind. Two unequal panels bowl then faces. Do not imply new seedlings harvested. エルナ「大盛り、つけといたよ。」 コウ「その分の原価は？」"></figure><figure class="scene detail" id="02-costs" style="--pause:23.08cqw"><img src="art/02-costs.png" width="887" height="1774" alt="Three hand closeups: purchased grain sack and meat basket invoice with abstract marks, seed packet and tool, Kou&#x27;s worn hands. Elna listening beside counter, purchased produce basket visible. コウ「自分の畑の野菜も、ただじゃない。」 コウ「種と、働いた時間がある。」"></figure><figure class="scene detail" id="03-coins" style="--pause:25.64cqw"><img src="art/03-coins.png" width="887" height="1774" alt="Top view six copper coins next to one meal, smaller closeup several expense piles and ledger sketch, lower Kou explaining to Elna. Exactly six sale coins in first view. NO readable text besides dialogue, no profit waterfall chart. コウ「六枚もらって、全部は残らない。」"></figure><figure class="scene conversation" id="04-wages" style="--pause:25.64cqw"><img src="art/04-wages.png" width="887" height="1774" alt="Three intimate unequal conversation panels: Kou earnest at ledger, Elna surprised and thoughtful, Kou replies. Quiet kitchen after closing, table clean, no other speakers. コウ「残りから、家賃と賃金を払う。」 エルナ「私たちの働いた分も？」 コウ「そこを削ると、続かない。」"></figure><figure class="scene varied" id="05-two-dishes" style="--pause:17.95cqw"><img src="art/05-two-dishes.png" width="887" height="1774" alt="Elna and Kou choose two practical dishes on clean prep counter, one grain-and-meat bowl and one soup, shared ingredients laid separately. Small inset simple blank menu board without text. Do not display dozens of fancy dishes. エルナ「今日は、二品に絞ろう。」 コウ「同じ仕込みで、出せるものに。」"></figure><figure class="scene varied" id="06-cook" style="--pause:19.23cqw"><img src="art/06-cook.png" width="887" height="1774" alt="Unequal closeups: washed leaves chopped on designated board; Elna adds leaves LAST to steaming pan or pot; larger shoulder view her timing heat. Kou only assists by handing clean ingredients. Food moisture and steam appetizing, no magical fireworks. エルナ「葉は、最後に。」 エルナ「色と食感を、残したい。」"></figure><figure class="scene conversation" id="07-reservation" style="--pause:23.08cqw"><img src="art/07-reservation.png" width="887" height="1774" alt="Auburn-haired young adult customer in ochre cloak returns at counter with steaming dish; medium Elna listens smiling, lower Kou looks toward seedling plot outside. Same customer as episode three, not Leon. 客「次の帰りも、この席に来たい。」 エルナ「予約、受けていいかな。」"></figure><figure class="scene hero" id="08-limit" style="--pause:46.15cqw"><img src="art/08-limit.png" width="887" height="1774" alt="Large quiet partnership scene under blue awning: Elna writes small reservation list with abstract marks, Kou beside her holding crop notebook, small plot at dusk. Serious hopeful sense of limited but workable business. コウ「畑に合わせて、数を決めよう。」 エルナ「売り切れも、先に伝える。」"></figure><footer><p>第6話 おわり</p><nav><a href="../episode-05/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-07/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
