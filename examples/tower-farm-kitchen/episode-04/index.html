<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第4話 低い桶は、嘘をつかない｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第4話</p><h1>低い桶は、嘘をつかない</h1><small>8〜12日目</small></header><figure class="scene varied" id="01-carry" style="--pause:20.51cqw"><img src="art/01-carry-before-build.png" width="887" height="1774" alt="Kou carries two manageable wooden water buckets along path, not over crop bed; small closeup blistered palm; Elna at diner kitchen doorway worried about empty prep table. Seedlings small, daytime. コウ「水を運ぶだけで、午前が終わる。」 エルナ「仕込みにも、来てほしい。」"></figure><figure class="scene conversation" id="02-iris" style="--pause:19.23cqw"><img src="art/02-iris-proposal.png" width="887" height="1774" alt="Iris enters beside empty wooden tank and laid-out ceramic pipe segments; medium Kou faces her, lower her hand sketches tank above beds. Goggles on forehead, navy short hair. No modern PVC or electronics. イリス「桶を上げれば、流れるよ。」 コウ「同じ量を、配れる？」"></figure><figure class="scene varied" id="03-stand" style="--pause:17.95cqw"><img src="art/03-stand.png" width="887" height="1774" alt="Three practical construction panels: Iris checks tank and support sketch, Kou and Balt assemble braced thick timber free-standing platform, Elna sees strong diagonal bracing. Water tank is still empty until stand complete. Do not place 160kg on flimsy roof. イリス「水だけで、百六十キロ。」 コウ「台から、作り直そう。」"></figure><figure class="scene detail" id="04-unequal" style="--pause:25.64cqw"><img src="art/04-unequal-reading-order.png" width="887" height="1774" alt="Three unequal closeups same elapsed test: different outlets pour into identical measuring cups, near cup contains more than far cup; lower Kou and Iris looking at difference. Tank only modest height, pipe has clear joints and accessible valves. コウ「手前ばかり、多い。」 イリス「高さと、管の長さが違うから。」"></figure><figure class="scene detail" id="05-zones" style="--pause:17.95cqw"><img src="art/05-zones.png" width="887" height="1774" alt="Iris points to simple wooden stopcock, Kou opens ONE bed section and measures delivered water; other sections closed. Hands and pipe physically coherent. Main outlet larger than tiny modern drip emitter. コウ「一列ずつ開けて、量を測る。」 イリス「壊れても、直せる形にしよう。」"></figure><figure class="scene varied" id="06-clean" style="--pause:20.51cqw"><img src="art/06-clean-closed-first.png" width="887" height="1774" alt="Two closeups and one face panel: removable mesh filter lifted from accessible housing, Elna rinses removable part in utility basin, Iris shows simple fitting. Irrigation tool cleaning not on food-prep surface. エルナ「この網、私にも外せる？」 イリス「うん。ここを、緩めて。」"></figure><figure class="scene continuous" id="07-magic-lift" style="--pause:30.77cqw"><img src="art/07-magic-lift-caster.png" width="887" height="1774" alt="Tall composition: small water spell lifts EXISTING water from source barrel to raised tank, luminous blue stream visibly connects both water bodies, source level falls; then valve sends stored water gently to one section while Iris lowers hand exhausted but satisfied. No conjured infinite water. コウ「魔法は、桶に上げる時だけ。」 イリス「流す間は、手が空くね。」"></figure><figure class="scene hero" id="08-time-saved" style="--pause:43.59cqw"><img src="art/08-time-saved-sequence-fixed.png" width="887" height="1774" alt="Large warm scene: Kou crouches inspecting SMALL seedlings, water delivery controlled in one background section; lower Elna invites him at blue-awning diner, still modest plot, no broad mature crop. His hands relaxed. コウ「空いた時間で、苗を見る。」 エルナ「それから、昼ごはんを作ろう。」"></figure><footer><p>第4話 おわり</p><nav><a href="../episode-03/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-05/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
