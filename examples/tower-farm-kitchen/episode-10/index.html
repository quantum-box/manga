<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10話 帰ってくる場所｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第10話</p><h1>帰ってくる場所</h1><small>42日目</small></header><figure class="scene varied" id="01-second-harvest" style="--pause:30.77cqw"><img src="art/01-second-harvest-crop-fixed.png" width="887" height="1774" alt="Same four beds with age-staggered sections: Kou and Balt harvest newly ready section while earlier harvested section is bare or freshly resown and younger sections remain smaller. Twine markers visible. Two hand closeups plus broad context. コウ「次の区画が、つながった。」 バルト「予定が、少し読めてきたな。」"></figure><figure class="scene conversation" id="02-sixteen" style="--pause:24.36cqw"><img src="art/02-sixteen-slots-fixed.png" width="887" height="1774" alt="Elna at reservation ledger with sixteen simple small marks, Kou beside bought produce basket and own harvest; outside supplier acknowledges arrangement. Two unequal panels include limited supply clearly. エルナ「まずは、一日十六食。」 コウ「足りない時の仕入れも、決めてある。」"></figure><figure class="scene conversation" id="03-partners" style="--pause:38.46cqw"><img src="art/03-partners.png" width="887" height="1774" alt="Three intimate panels at clean diner counter: Elna earnest facing Kou, her hand placing shop key on table, Kou thoughtfully reaching to joint crop-and-menu notebook rather than seizing key. Adult respectful partnership. エルナ「畑と厨房、一緒に決めたい。」 エルナ「店の相棒に、なってくれる？」 コウ「働く分も、きちんと分けよう。」"></figure><figure class="scene detail" id="04-maintenance" style="--pause:19.23cqw"><img src="art/04-maintenance-sequence-fixed.png" width="887" height="1774" alt="Iris shows Elna how to open removable irrigation filter housing beside sturdy tank stand; Kou stands back listening, not doing every task. Closeups demonstrate same fitting as episode four; no modern gadgets. イリス「詰まったら、ここを開ける。」 エルナ「直し方も、店に残しておく。」"></figure><figure class="scene varied" id="05-seed-future" style="--pause:25.64cqw"><img src="art/05-seed-future.png" width="887" height="1774" alt="Balt and Kou beside small separate reserved seed-production strip of garden-leaf plants, a few plants left standing, NOT mature seed harvested already. Hand places plain marker, separate harvest basket for food. コウ「この畝は、次の種を残す。」 バルト「売る分だけじゃ、先へ続かん。」"></figure><figure class="scene hero" id="06-returner" style="--pause:41.03cqw"><img src="art/06-returner.png" width="887" height="1774" alt="Large borderless warm diner entrance view: auburn young adult customer in ochre cloak returns slightly dusty from expedition, Elna smiles at serving window, empty familiar seat in foreground and hot meal ready. Kou assists quietly behind her, no duplicate character heads. 客「帰ってきたよ。」 エルナ「おかえり。席、空いてる。」"></figure><figure class="scene varied" id="07-share-work" style="--pause:33.33cqw"><img src="art/07-share-work.png" width="887" height="1774" alt="Kou and Elna share plain illustrated maintenance/crop notebook on porch, smaller montage Balt observing seedlings and Iris storing spare fitting; characters in separate successive frames, not simultaneously duplicated. Quiet achieved trust, no magical new world omniscience. コウ「俺がいなくても、回るように。」 エルナ「そのための店、だね。」 時刻表示：42日目"></figure><figure class="scene hero" id="08-next-floor" style="--pause:58.97cqw"><img src="art/08-next-floor.png" width="887" height="1774" alt="Final large scene: Leon at blue-awning diner brings small parchment sketch of colder upper-floor outpost, Kou and Elna look toward distant ascending stone stairs. Warm kitchen foreground and cool stairway beyond establish future, not new farm already built upstairs. レオン「七階でも、この飯を出せるか？」 コウ「まず、畑と台所を見に行こう。」"></figure><footer><p>第10話 おわり</p><nav><a href="../episode-09/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
