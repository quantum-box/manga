<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第1話 水の出口｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第1話</p><h1>水の出口</h1><small>召喚当日・昼から夕方</small></header><figure class="scene continuous" id="01-arrival" style="--pause:25.64cqw"><img src="art/01-arrival-lettered.png" width="887" height="1774" alt="One tall borderless vertical scene: Kou startled and unsteady on the paved lane at the top; his eyes follow immense pale sandstone ribs to the glowing ceiling; downward motion returns to his dirt-stained hands and green apron. Tower interior only, NOT open outdoor sky. He remembers farming but no Earth scene. Two separate moments, not duplicate simultaneous people. コウ・心「畑にいたはずなのに。」 コウ「ここ、どこだ……。」"></figure><figure class="scene conversation" id="02-gate" style="--pause:23.08cqw"><img src="art/02-gate-lettered.png" width="887" height="1774" alt="Three unequal panels: medium Kou facing a plain wooden administrative desk; closer offscreen clerk&#x27;s hand indicating a closed stone gate diagram without lettering; closeup Kou absorbing the answer. Clerk is an ordinary older adult in beige robe, not Leon. Show patient exchange, hope and worry. 係員「帰還の門は、今は閉じてる。」 コウ「帰る方法は、あるんですね？」 係員「調査待ちだ。まずは寝床だ。」"></figure><figure class="scene varied" id="03-diner" style="--pause:15.38cqw"><img src="art/03-diner-lettered.png" width="887" height="1774" alt="Wide panel: Kou pauses outside diner blue awning, hungry, Elna at serving window to his left. Small inset of his hand on stomach. Lower medium panel of Elna turning toward vegetable plot. Keep paved lane left and beds right of diner. コウ「飯代なら、働きます。」 エルナ「畑を、見られる？」"></figure><figure class="scene varied" id="04-wet-soil" style="--pause:17.95cqw"><img src="art/04-wet-soil-lettered.png" width="887" height="1774" alt="Three unequal panels in the same plot: wide Elna left and crouching Kou right beside wilted broad leafy vegetables; closeup her tense hand holding a small fertilizer sack closed; lower closeup Kou pressing moist soil, not pouring water. Water remains pooled, drain is still blocked. エルナ「水も肥料も、増やしたのに。」 コウ「この土、ずっと湿ってる？」"></figure><figure class="scene detail" id="05-roots" style="--pause:24.36cqw"><img src="art/05-roots-lettered.png" width="887" height="1774" alt="Two medium panels with a narrow hand closeup between: Kou gently exposes one small plant&#x27;s roots with a trowel; dark compact wet root zone and some damaged roots, no instant healthy glow; Elna silently watches and responds to his cautious expression. Exactly one dug plant, nearby plants remain rooted. コウ「葉より先に、根を見たい。」 コウ「悪い場所も、残して比べよう。」"></figure><figure class="scene conversation" id="06-permission" style="--pause:20.51cqw"><img src="art/06-permission-lettered.png" width="887" height="1774" alt="Three unequal conversation panels at removable wooden drain inspection cover near plot edge: Kou asks while pointing at cover; Elna with diner blue awning behind answers; their hands reach for the same cover after permission. Drain not flowing yet, leaves and silt block its opening. コウ「この出口、誰が管理してる？」 エルナ「店の区画は、私が掃除する決まり。」 コウ「開けてもいい？」 エルナ「うん。お願い。」"></figure><figure class="scene continuous" id="07-flow" style="--pause:35.90cqw"><img src="art/07-flow-repaired.png" width="887" height="1774" alt="One tall flowing composition plus two small unequal hand closeups at the top: Kou removes leaf litter and silt from accessible outlet, Elna holds lifted cover aside; clear visible flow then follows the channel downward and out safely to common drain. No digging through structural wall, no flooding other houses, wilted plants remain wilted. The visible action causes the flow. 効果音「ごぼっ」"></figure><figure class="scene hero" id="08-first-meal" style="--pause:46.15cqw"><img src="art/08-first-meal-lettered.png" width="887" height="1774" alt="Three panels with final large warm scene: Elna sets a steaming barley-and-meat bowl on diner counter for Kou; closeup his rough hands near the bowl as he looks worried toward the still wilted garden; final Elna&#x27;s gentle expression and Kou&#x27;s relieved face in warm kitchen lamplight. Vegetables and grain are already purchased or existing, not newly grown. No miraculous lush plot. エルナ「今日は、ここで食べて。」 コウ「まだ、畑は治ってない。」 エルナ「でも、水は動いたよ。」"></figure><footer><p>第1話 おわり</p><nav><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-02/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
