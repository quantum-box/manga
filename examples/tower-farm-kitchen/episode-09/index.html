<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第9話 十二人に届ける一便｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第9話</p><h1>十二人に届ける一便</h1><small>36日目</small></header><figure class="scene varied" id="01-twelve" style="--pause:23.08cqw"><img src="art/01-twelve-count-fixed.png" width="887" height="1774" alt="Elna prepares twelve simple clean covered food containers on kitchen table, Kou confirms at ledger, background bought grain and meat with harvested leaves. Three panels cooking, lids, plan. No overflowing hundred-meal feast. エルナ「三階の集結所まで、十二食。」 コウ「温かいうちに、渡そう。」"></figure><figure class="scene detail" id="02-tools" style="--pause:17.95cqw"><img src="art/02-tools-separated-fixed.png" width="887" height="1774" alt="Two designated clean cooking pots, Elna points to kitchen-only utensils, small inset dirty irrigation buckets remain OUTSIDE on separate utility shelf; Kou wipes hands before touching packed food. Two unequal panels, no unsafe mixing. エルナ「この鍋は、料理だけ。」 コウ「畑の桶とは、混ぜない。」"></figure><figure class="scene conversation" id="03-delay" style="--pause:28.21cqw"><img src="art/03-delay-cargo-fixed.png" width="887" height="1774" alt="Stone gate lane inside third floor, Kou with small covered handcart of food, local gate worker in beige points to waiting cargo queue, Elna worried. No fighting or sword attack, delay is transport coordination. 係員「今日は、通行便が遅れる。」 コウ「受け渡し場所を、変えられる？」"></figure><figure class="scene conversation" id="04-contact" style="--pause:20.51cqw"><img src="art/04-contact.png" width="887" height="1774" alt="Leon at nearby third-floor assembly entrance instructs assistant while Kou and Elna listen, short hand gesture showing safe nearby pickup location, clear geographical continuity and no gate bypass. レオン「入口側で受け取る。連絡は俺がする。」 エルナ「その場所なら、間に合う。」"></figure><figure class="scene continuous" id="05-cart" style="--pause:25.64cqw"><img src="art/05-cart-cargo-fixed.png" width="887" height="1774" alt="One tall continuous scene of small handcart rolling down paved lane from diner toward visible nearby third-floor assembly arch, Elna walking beside Kou; closeup careful hands securing covered containers, no exposed food or magical flying cart. コウ「鍋を持つ人も、攻略隊なんだな。」 エルナ「食べるところまでが、私たちの仕事。」"></figure><figure class="scene conversation" id="07-proof" style="--pause:25.64cqw"><img src="art/07-proof-bowls-fixed.png" width="887" height="1774" alt="Leon checks all twelve recipients and signs delivery note with abstract marks, closeup professional respectful face, Kou listening with Elna nearby. No vast gold payment or instant huge contract. レオン「十二食、欠けずに届いた。」 レオン「次は、続けられるかを見よう。」"></figure><figure class="scene hero" id="06-team-eats" style="--pause:35.90cqw"><img src="art/06-team-eats-cast-fixed.png" width="887" height="1774" alt="Three unequal panels in assembly courtyard: modest adult adventurer squad receives covered meals, one tired brown-haired swordswoman tastes hot greens and grain, relaxed smiles around low table. Weapons sheathed away from food. No wounded person magically healed. 隊員「今日は、ちゃんと飯を食えた。」 隊員「帰ったら、店にも寄る。」"></figure><figure class="scene hero" id="08-one-delivery" style="--pause:48.72cqw"><img src="art/08-one-delivery-cargo-fixed.png" width="887" height="1774" alt="Large quiet evening return to diner, empty cleanable containers and handcart, Kou and Elna sit on porch tired but satisfied. Plot not magically mature everywhere. Small lantern warmth under blue awning. コウ「一便はできた。毎日は、これからだ。」 エルナ「今日は、この十二人分でいい。」"></figure><footer><p>第9話 おわり</p><nav><a href="../episode-08/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-10/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
