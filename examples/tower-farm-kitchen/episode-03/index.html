<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第3話 一度に播くな｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第3話</p><h1>一度に播くな</h1><small>5〜7日目</small></header><figure class="scene conversation" id="01-customer" style="--pause:21.79cqw"><img src="art/01-customer.png" width="887" height="1774" alt="Diner counter, young adult adventurer with auburn short hair and muted ochre cloak finishes bowl; Elna listens smiling then worried. Small inset empty leafy garnish plate. This recurring customer is not Leon. 客「明日も、この葉を頼む。」 エルナ「……明日も？」"></figure><figure class="scene detail" id="02-empty-basket" style="--pause:28.21cqw"><img src="art/02-empty-basket.png" width="887" height="1774" alt="Kou and Elna outside serving window, clean empty harvest basket in foreground; two unequal closeups basket and Kou&#x27;s thoughtful face. Existing harvest has been used, garden cannot immediately replace it. コウ「一度に採れたら、次は空く。」 エルナ「畑にも、仕込みがいるんだ。」"></figure><figure class="scene varied" id="03-native-seed" style="--pause:17.95cqw"><img src="art/03-native-seed.png" width="887" height="1774" alt="Balt on plot path shows tiny native seed in palm, Kou listens close, lower panel glowing ceiling vein and differently shaded bed corner. Plain seed packet without labels. バルト「庭葉は、光が弱いと遅れる。」 コウ「ここで育つ速さを、測ろう。」"></figure><figure class="scene detail" id="04-germination" style="--pause:17.95cqw"><img src="art/04-germination-sequence-fixed.png" width="887" height="1774" alt="Three brief closeups: handful of small seeds; Kou places an equal counted sample on damp cloth in shallow dish; notebook makes tally marks with room for future result. No sprouts already in newly set test, no predicted yield on screen. コウ「全部の種が、芽を出すとは限らない。」"></figure><figure class="scene varied" id="05-twelve-plots" style="--pause:25.64cqw"><img src="art/05-twelve-plots-map-fixed.png" width="887" height="1774" alt="Elevated plot view with FOUR long parallel beds, each divided into THREE equal subsections by small twine markers, total twelve sections; medium Kou and Elna looking at plain sketched plan. Bed widths consistent, no implausible giant farm. Leave words off diagram. コウ「四つの畝を、十二に分ける。」 コウ「七日ずつ、播く日をずらそう。」"></figure><figure class="scene varied" id="06-sow" style="--pause:20.51cqw"><img src="art/06-sow-sequence-fixed.png" width="887" height="1774" alt="Three unequal hand-action panels: Elna makes shallow sowing line in prepared bed; Kou sows tiny seeds in one selected section; soil gently covers seeds. Only first three of twelve sections are sown this week; other sections stay bare or contain existing plants. No germination in same instant. エルナ「今日は、この三つ。」 コウ「次は、七日後だ。」"></figure><figure class="scene conversation" id="07-buy" style="--pause:17.95cqw"><img src="art/07-buy.png" width="887" height="1774" alt="Diner back door, local farmer delivers basket of existing leafy vegetables, Elna and Kou accept and tally purchase. Distinct plain brown-clothed adult supplier, not main cast duplicated. Bought grain sack also visible. コウ「最初の収穫までは、仕入れる。」 エルナ「その代金も、計算に入れよう。」"></figure><figure class="scene hero" id="08-calendar" style="--pause:46.15cqw"><img src="art/08-calendar-time-fixed.png" width="887" height="1774" alt="Large quiet evening scene under blue awning, Kou and Elna beside notebook with four simple week columns and small drawings, no readable diagram text; tiny new sown beds visible through window at ground, no mature crop there. Their serious hopeful faces dominate. コウ「明日の客と、四週間後の畑。」 エルナ「両方、見ていくんだね。」"></figure><footer><p>第3話 おわり</p><nav><a href="../episode-02/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-04/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
