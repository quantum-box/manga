<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" as="image" href="art/cover.jpg"><title>天魔神教、再興 第1話 膝をつくな</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#222}body{font-family:system-ui,sans-serif}main{max-width:480px;margin:auto;container-type:inline-size}header{padding:40px 22px 28px}header h1{font-size:24px;line-height:1.4;margin:0 0 14px}header p{font-size:16px;margin:0}figure{margin:0}.panel{width:var(--w)}.left{margin-right:auto}.right{margin-left:auto}.center{margin-left:auto;margin-right:auto}.crop{position:relative;width:100%;aspect-ratio:var(--cw)/var(--ch);overflow:hidden;background:white}.crop img{position:absolute;max-width:none;width:var(--iw);height:var(--ih);left:var(--cx);top:var(--cy);display:block}.pause{height:var(--pause)}.row{display:flex;align-items:center;gap:8px}.row .panel{width:calc(50% - 4px)}footer{padding:64px 24px 90px;text-align:center;font-size:16px}footer p{line-height:1.8}a{color:inherit}</style></head><body><main><header><h1>天魔神教、再興</h1><p>第1話　膝をつくな</p></header><div id="comic-body"><figure id="p001" data-panel="1" class="panel left" style="--w:100%;--col:0;--row:0;--cw:506;--ch:760;--iw:202.371542%;--ih:202.105263%;--cx:-0.395257%;--cy:-0.263158%"><div class="crop" data-cover-frame><img src="art/scene-01.png" width="1024" height="1536" alt="Wide establishing interior of the Heavenly Demon Sect&#x27;s great hall at night: immense sect banners, flames beyond far doorway, exhausted disciples retreating while older sect leader Yan stands between them and invading soldiers. He commands protection, not a coronation. Frame his silhouette and the hall. 語り「天魔神教 教主 燕無咎　四十八歳」" decoding="async"></div></figure><div class="pause response" data-after="1" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p002" data-panel="2" class="panel right" style="--w:80%;--col:1;--row:0;--cw:504;--ch:760;--iw:203.174603%;--ih:202.105263%;--cx:-102.777778%;--cy:-0.263158%"><div class="crop"><img src="art/scene-01.png" width="1024" height="1536" alt="Close a departing adult disciple&#x27;s two hands respectfully offering a small plain white porcelain cup of dark tea to older Yan. Yan accepts and sips, trusting him without looking away from distant battle. The disciple face stays shadowed and unidentifiable, no special ring emblem. A light visual cue of trust, no obvious poison bottle. 燕無咎「ここは俺が守る 皆は下がれ」" decoding="async"></div></figure><figure id="p003" data-panel="3" class="panel center" style="--w:88%;--col:0;--row:1;--cw:506;--ch:764;--iw:202.371542%;--ih:201.047120%;--cx:-0.395257%;--cy:-100.785340%"><div class="crop"><img src="art/scene-01.png" width="1024" height="1536" alt="Invading armored soldiers charge through the doorway at older Yan; he places the SAME white cup on a short stone ledge near steps, calmly rests right hand on jian hilt. Clear spatial connection cup ledge and battlefield." decoding="async"></div></figure><figure id="p004" data-panel="4" class="panel right" style="--w:100%;--col:1;--row:1;--cw:505;--ch:764;--iw:202.772277%;--ih:201.047120%;--cx:-102.376238%;--cy:-100.785340%"><div class="crop"><img src="art/scene-01.png" width="1024" height="1536" alt="Big dramatic older Yan right-handed horizontal jian slash at attacking soldiers, thick sweeping impact trajectory, weapons break and soldiers thrown back, no gore. Low angle makes overwhelming skill readable. No allies join him." decoding="async"></div></figure><div class="pause transition" data-after="4" data-css-height="100" style="--pause:25.641026cqw" aria-label="戦いの結果から空になった味方側へ視線を戻す"></div><figure id="p005" data-panel="5" class="panel left" style="--w:84%;--col:0;--row:0;--cw:507;--ch:733;--iw:201.972387%;--ih:209.549795%;--cx:-0.394477%;--cy:-0.272851%"><div class="crop"><img src="art/scene-02.png" width="1024" height="1536" alt="Aftermath in SAME fortress doorway: defeated enemy soldiers&#x27; weapons on floor, older Yan remains unwounded standing. He lowers jian and turns toward the hall behind him. The fight has ended. 燕無咎・心「敵は 斬り伏せた」" decoding="async"></div></figure><div class="pause response" data-after="5" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p006" data-panel="6" class="panel right" style="--w:100%;--col:1;--row:0;--cw:503;--ch:733;--iw:203.578529%;--ih:209.549795%;--cx:-103.180915%;--cy:-0.272851%"><div class="crop"><img src="art/scene-02.png" width="1024" height="1536" alt="View from behind older Yan into SAME abandoned hall: empty ranks, broken sect banner hanging, scattered disciples&#x27; abandoned cloaks, retreating silhouettes very far away. His extended empty left hand asks where his people are; loneliness not triumph. 燕無咎「…誰か 残っているか」" decoding="async"></div></figure><div class="pause response" data-after="6" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p007" data-panel="7" class="panel center" style="--w:100%;--col:0;--row:1;--cw:507;--ch:796;--iw:201.972387%;--ih:192.964824%;--cx:-0.394477%;--cy:-92.713568%"><div class="crop"><img src="art/scene-02.png" width="1024" height="1536" alt="Old steward Qiu, age86 white beard pale patched robe, stumbles into SAME hall supporting a wrapped wound at ribs; clutching a single scorched child-sized cloth shoe in other hand. Yan rushes to support him by elbow before he falls. Non-graphic injury. 燕無咎「丘爺！」" decoding="async"></div></figure><div class="pause response" data-after="7" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p008" data-panel="8" class="panel right" style="--w:76%;--col:1;--row:1;--cw:504;--ch:796;--iw:203.174603%;--ih:192.964824%;--cx:-102.777778%;--cy:-92.713568%"><div class="crop"><img src="art/scene-02.png" width="1024" height="1536" alt="Medium close older Yan kneels supporting fading old Qiu against a column. Qiu offers the small scorched child&#x27;s shoe, ash and exhaustion show he came from burned home village. Yan looks at shoe then Qiu in stunned recognition, no smile. 丘爺「村の子らを… 救えませなんだ」" decoding="async"></div></figure><div class="pause transition" data-after="8" data-css-height="160" style="--pause:41.025641cqw" aria-label="靴の意味を受け止めて三日前の判断へ入る"></div><figure id="p009" data-panel="9" class="panel left" style="--w:84%;--col:0;--row:0;--cw:507;--ch:763;--iw:201.972387%;--ih:201.310616%;--cx:-0.394477%;--cy:-0.262123%"><div class="crop"><img src="art/scene-03.png" width="1024" height="1536" alt="FLASHBACK three days earlier, same older Yan and white-bearded old Qiu alive and healthy in fortress council chamber. Qiu pleading and pointing to an ordinary village position on cloth map; worried, trying to persuade rather than bowing low. Pale soft panel edges distinguish memory. Yan listens stiffly. 丘爺「村へ援軍を！ 今ならまだ…」" decoding="async"></div></figure><div class="pause response" data-after="9" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p010" data-panel="10" class="panel right" style="--w:80%;--col:1;--row:0;--cw:507;--ch:763;--iw:201.972387%;--ih:201.310616%;--cx:-101.577909%;--cy:-0.262123%"><div class="crop"><img src="art/scene-03.png" width="1024" height="1536" alt="FLASHBACK continued same table: older Yan closes his fist firmly on the capital fortress marker and turns away from the pleading Qiu, explicitly refusing to spare soldiers. Qiu&#x27;s hand remains extended over village marker, rejected. Faces clear. 燕無咎「都が先だ 兵は出さぬ」" decoding="async"></div></figure><div class="pause response" data-after="10" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p011" data-panel="11" class="panel center" style="--w:100%;--col:0;--row:1;--cw:507;--ch:765;--iw:201.972387%;--ih:200.784314%;--cx:-0.394477%;--cy:-100.522876%"><div class="crop"><img src="art/scene-03.png" width="1024" height="1536" alt="BACK TO PRESENT burned great hall: close Qiu&#x27;s thin hand with child-sized scorched shoe loosens and falls still against Yan&#x27;s sleeve. Yan tries to hold his wrist, shock. Show death through slack hand and stopped movement, no blood or gore. Same robe and shoe." decoding="async"></div></figure><div class="pause response" data-after="11" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p012" data-panel="12" class="panel right" style="--w:100%;--col:1;--row:1;--cw:508;--ch:765;--iw:201.574803%;--ih:200.784314%;--cx:-101.181102%;--cy:-100.522876%"><div class="crop"><img src="art/scene-03.png" width="1024" height="1536" alt="Older Yan bows over Qiu&#x27;s motionless body against column and presses the cold hand between both hands; crown still on Yan, jian set safely on ground. He understands his decision cost the village and this companion. Focus grief on face and hand. 燕無咎「俺が 行かせなかった」" decoding="async"></div></figure><div class="pause transition" data-after="12" data-css-height="220" style="--pause:56.410256cqw" aria-label="死んだ丘爺の冷たい手を握る時間を残す"></div><figure id="p013" data-panel="13" class="panel left" style="--w:84%;--col:0;--row:0;--cw:506;--ch:764;--iw:202.371542%;--ih:201.047120%;--cx:-0.395257%;--cy:-0.261780%"><div class="crop"><img src="art/scene-04.png" width="1024" height="1536" alt="Older Yan alone rises from dead Qiu in SAME burned hall, suddenly grips chest and coughs small dark stain into palm; face shocked at poison taking effect, legs buckle. He is not stabbed or defeated by an attacker. White tea cup on stone ledge clearly visible in background. 燕無咎「毒… さっきの茶か」" decoding="async"></div></figure><figure id="p014" data-panel="14" class="panel right" style="--w:80%;--col:1;--row:0;--cw:506;--ch:764;--iw:202.371542%;--ih:201.047120%;--cx:-101.976285%;--cy:-0.261780%"><div class="crop"><img src="art/scene-04.png" width="1024" height="1536" alt="Close matching SAME plain white cup fallen on floor spilling dark tea. Older Yan&#x27;s reflected face in dark pool, one poison-darkened droplet below his mouth; shadowed departing disciple&#x27;s empty sleeve at far edge, unidentifiable. His understanding of betrayal is the focus, no magic. 燕無咎・心「敵より近くに 裏切りがあった」" decoding="async"></div></figure><figure id="p015" data-panel="15" class="panel center" style="--w:100%;--col:0;--row:1;--cw:506;--ch:762;--iw:202.371542%;--ih:201.574803%;--cx:-0.395257%;--cy:-101.312336%"><div class="crop"><img src="art/scene-04.png" width="1024" height="1536" alt="Older Yan collapses seated next to motionless Qiu at column, crown falls from his head onto wet stone, sword remains beside him. He looks from empty hall to Qiu, profound regret not rage, no active enemies. 燕無咎・心「王になれば 守れると思った」" decoding="async"></div></figure><div class="pause response" data-after="15" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p016" data-panel="16" class="panel right" style="--w:100%;--col:1;--row:1;--cw:506;--ch:762;--iw:202.371542%;--ih:201.574803%;--cx:-101.976285%;--cy:-101.312336%"><div class="crop"><img src="art/scene-04.png" width="1024" height="1536" alt="Extreme close older Yan&#x27;s face and one hand reaching toward Qiu, eyes closing at last exhale; black pencil shadows dissolve to unmarked white at bottom. Clear final stillness of death, no young version, no supernatural portal or second body. 燕無咎・心「もう一度だけ… 今度こそ…」" decoding="async"></div></figure><div class="pause transition" data-after="16" data-css-height="460" style="--pause:117.948718cqw" aria-label="呼吸が止まった後に白い間を置き、目覚めの息へつなぐ"></div><figure id="p017" data-panel="17" class="panel left" style="--w:100%;--col:0;--row:0;--cw:507;--ch:730;--iw:201.972387%;--ih:210.410959%;--cx:-0.394477%;--cy:-0.273973%"><div class="crop"><img src="art/scene-05.png" width="1024" height="1536" alt="Young Yan wakes with hand grasping his throat on a wooden bed in shabby mountain shrine; morning white light, startled not smiling. 燕無咎「毒は…？」" decoding="async"></div></figure><div class="pause response" data-after="17" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p018" data-panel="18" class="panel right" style="--w:80%;--col:1;--row:0;--cw:504;--ch:730;--iw:203.174603%;--ih:210.410959%;--cx:-102.777778%;--cy:-0.273973%"><div class="crop"><img src="art/scene-05.png" width="1024" height="1536" alt="Close reflection in bronze washbasin: young unscarred face, black topknot, hands touch cheek; recognition. 燕無咎・心「傷も白髪も なくなっている」" decoding="async"></div></figure><div class="pause response" data-after="18" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p019" data-panel="19" class="panel center" style="--w:88%;--col:0;--row:1;--cw:507;--ch:795;--iw:201.972387%;--ih:193.207547%;--cx:-0.394477%;--cy:-92.955975%"><div class="crop"><img src="art/scene-05.png" width="1024" height="1536" alt="Steward Qiu alive at doorway carrying linen bandages and a cracked water bowl; Yan freezes at sight. 丘爺「無咎？ 熱は引いたか」" decoding="async"></div></figure><div class="pause response" data-after="19" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p020" data-panel="20" class="panel right" style="--w:100%;--col:1;--row:1;--cw:504;--ch:795;--iw:203.174603%;--ih:193.207547%;--cx:-102.777778%;--cy:-92.955975%"><div class="crop"><img src="art/scene-05.png" width="1024" height="1536" alt="Yan kneels touching living Qiu&#x27;s warm wrist; surprised steward steadies him, Yan&#x27;s eyes wet but held controlled. 燕無咎「丘爺…？ 生きているのか」" decoding="async"></div></figure><div class="pause transition" data-after="20" data-css-height="120" style="--pause:30.769231cqw" aria-label="生きている丘爺の手を握った感触を残す"></div><figure id="p021" data-panel="21" class="panel left" style="--w:84%;--col:0;--row:0;--cw:508;--ch:765;--iw:201.574803%;--ih:200.784314%;--cx:-0.393701%;--cy:-0.261438%"><div class="crop"><img src="art/scene-06.png" width="1024" height="1536" alt="Close Yan grips old plain jian, sheath rests beside it, checks familiar right hand form. 丘爺「二十二にもなって 寝ぼけおって」" decoding="async"></div></figure><div class="pause response" data-after="21" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p022" data-panel="22" class="panel right" style="--w:100%;--col:1;--row:0;--cw:506;--ch:765;--iw:202.371542%;--ih:200.784314%;--cx:-101.976285%;--cy:-0.261438%"><div class="crop"><img src="art/scene-06.png" width="1024" height="1536" alt="Yan traces one precise short slash through falling drop over bowl; drop splits in two, bowl remains intact. 燕無咎・心「技は… 覚えている」" decoding="async"></div></figure><figure id="p023" data-panel="23" class="panel center" style="--w:88%;--col:0;--row:1;--cw:508;--ch:763;--iw:201.574803%;--ih:201.310616%;--cx:-0.393701%;--cy:-101.048493%"><div class="crop"><img src="art/scene-06.png" width="1024" height="1536" alt="Wide shabby shrine: eight exhausted adult sect survivors and scarce tied grain sacks, dying fire, patched roof; Qiu shows two fingers. 丘爺「残りは八人 米も二日分じゃ」 燕無咎・心「二十六年前に 戻ったのか？」" decoding="async"></div></figure><div class="pause response" data-after="23" data-css-height="14" style="--pause:3.589744cqw" aria-label="短い反応・返答を受け止める"></div><figure id="p024" data-panel="24" class="panel right" style="--w:76%;--col:1;--row:1;--cw:506;--ch:763;--iw:202.371542%;--ih:201.310616%;--cx:-101.976285%;--cy:-101.048493%"><div class="crop"><img src="art/scene-06.png" width="1024" height="1536" alt="Yan ties scabbard at left waist and gives Qiu his small money pouch, stands determined facing mountain path; he is leaving to find people. 燕無咎「人を 迎えに行く」" decoding="async"></div></figure><div class="pause transition" data-after="24" data-css-height="180" style="--pause:46.153846cqw" aria-label="出発から市場への距離を置く"></div><figure id="p025" data-panel="25" class="panel left" style="--w:100%;--col:0;--row:0;--cw:508;--ch:765;--iw:201.574803%;--ih
