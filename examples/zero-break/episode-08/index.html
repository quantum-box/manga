 width="948" height="1659" alt="FIRST full huge WHITE armored ancient hero statue with GOLD chest star, no visible living face; small red-scarf Ren below looks up. Retain unknown name, no Arata caption. Ren『誰だ、この人。』"></figure><div class="pause" aria-hidden="true" style="--pause:35.9cqw"></div><figure class="scene left" id="first-hero"><img src="art/03-first-hero.png" width="1122" height="1402" alt="Thin masked ceremony guide in grey formal robe points to white statue, neutral expression. Ren Mira listen. Guide『初代勇者です。』"></figure><div class="pause" aria-hidden="true" style="--pause:28.21cqw"></div><figure class="scene left" id="compare-star"><img src="art/04-compare-star.png" width="1448" height="1086" alt="Mira looks from statue GOLD star to Ren&#x27;s faint CYAN chest point visible at scarf shirt neckline. Close bodily clue, not equal color or new form. Mira『星の形が、同じ…。』"></figure><div class="pause" aria-hidden="true" style="--pause:38.46cqw"></div><figure class="scene right" id="trial-door"><img src="art/05-trial-door.png" width="1448" height="1086" alt="Guide opens iron trial door with one key, team waits behind; targets and prisoners hidden until next scene. No later evidence text yet. "></figure><div class="pause" aria-hidden="true" style="--pause:217.95cqw"></div><figure class="scene bleed" id="human-targets"><img src="art/06-human-targets.png" width="948" height="1659" alt="FIRST trial hall reveal: living adult residents shackled upright on movable training target platforms; mechanical launchers aimed nearby. Graphic violence absent, ropes/chain clear, lives endangered. Ren shocked. Ren『人を、的にするのか。』"></figure><div class="pause" aria-hidden="true" style="--pause:30.77cqw"></div><figure class="scene left" id="refuse"><img src="art/07-refuse.png" width="1122" height="1402" alt="Ren turns away from offered ceremonial sword, opens empty hand toward captive adults; expression controlled outrage. Ren『こんな試験、受けない。』"></figure><div class="pause" aria-hidden="true" style="--pause:24.36cqw"></div><figure class="scene left" id="disqualify"><img src="art/08-disqualify.png" width="1448" height="1086" alt="Ceremony guide pulls bell rope and points to exit with judge gesture. Bell effect カン . No attack or ren armor yet. Guide『失格です。』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene left" id="turn-back"><img src="art/09-turn-back.png" width="1122" height="1402" alt="Ren turns his BACK to guide and walks toward captive adult&#x27;s dangling chain, bare hand already reaching. Rook and Mira prepare to assist, no full armor. "></figure><div class="pause" aria-hidden="true" style="--pause:24.36cqw"></div><figure class="scene right" id="cut-chain"><img src="art/10-cut-chain.png" width="1122" height="1402" alt="Only Ren&#x27;s black armored LEFT forearm with cyan seam forms to protect resident as mechanism tensions chain; he breaks one chain link with gloved hand, RIGHT bare hand steadies resident. Other residents still chained. "></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene bleed" id="guards-run"><img src="art/11-guards-run.png" width="948" height="1659" alt="Grey helmeted guards run from statue shadow toward freeing team; Rook raises shield at doorway, Mira guides freed residents behind him. Not an enemy victory image. "></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene right" id="hold-exit"><img src="art/12-hold-exit.png" width="1122" height="1402" alt="Rook blocks guards at narrow hall exit with shield and sheathed sword as barrier, no killing, Ren breaks remaining restraints behind. Rook『この出口は、閉めさせない。』"></figure><div class="pause" aria-hidden="true" style="--pause:33.33cqw"></div><figure class="scene right" id="copy-evidence"><img src="art/13-copy-evidence.png" width="1448" height="1086" alt="Mira copies trial recording via brass memory crystal at wall console. Exact large display text 記録保存 on
