.png" width="1448" height="1086" alt="Close original black crystal-on-silver-pedestal meter from episode1 now at workshop bench shows exact big ０ on horizontal plaque. Ren bare hand on crystal, no armor. "></figure><div class="pause" aria-hidden="true" style="--pause:23.08cqw"></div><figure class="scene left" id="replay"><img src="art/03-replay.png" width="1122" height="1402" alt="Noa slowly replays paper/oscilloscope line: magic needle flat while cyan chest glow visible in recording. Gesture toward discrepancy, device design consistent. Noa『針は、動いてない。』"></figure><div class="pause" aria-hidden="true" style="--pause:33.33cqw"></div><figure class="scene right" id="other-axis"><img src="art/04-other-axis.png" width="1122" height="1402" alt="Mira draws TWO clear simple graph axes on paper, one flat, one rises during rescuing; exact large horizontal labels 魔力 and 救助負荷 . Ren leans in, not instantly master explanation. Mira『空じゃない。測る箱が違う。』"></figure><div class="pause" aria-hidden="true" style="--pause:35.9cqw"></div><figure class="scene left" id="understand"><img src="art/05-understand.png" width="1122" height="1402" alt="Ren touches bare chest over faint cyan core, eyes widen with slow relief, red scarf moved slightly but same outfit. Ren『ゼロでも、ここにはある。』"></figure><div class="pause" aria-hidden="true" style="--pause:41.03cqw"></div><figure class="scene bleed" id="siege"><img src="art/06-siege.png" width="948" height="1659" alt="Outside night alley, grey armored royal guards surround workshop main door and power pillar. Inside team not yet fighting, no graphic force. "></figure><div class="pause" aria-hidden="true" style="--pause:24.36cqw"></div><figure class="scene right" id="cut-power"><img src="art/07-cut-power.png" width="1448" height="1086" alt="Guard lever cuts workshop supply cable at street fuse box, lanterns inside dim visible through window. Ordinary electrical sabotage, no future villain face. "></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene right" id="ventilator-stops"><img src="art/08-ventilator-stops.png" width="1122" height="1402" alt="Inside simple medical alcove, OLD MAN brown vest grey beard saved in episode5 on cot uses brass bellows breathing assistance, motion slows; Mira notices distress, no death or gore. Mira『呼吸の装置が…！』"></figure><div class="pause" aria-hidden="true" style="--pause:19.23cqw"></div><figure class="scene right" id="check-patient"><img src="art/09-check-patient.png" width="1448" height="1086" alt="Ren unarmored kneels beside same elderly man with shallow breath, checks wrist while Noa pulls isolated test circuit box from shelf. No immediate success. "></figure><div class="pause" aria-hidden="true" style="--pause:19.23cqw"></div><figure class="scene right" id="isolate-circuit"><img src="art/10-isolate-circuit.png" width="1122" height="1402" alt="Noa connects ONLY isolated rescue-core circuit to ventilator, physical copper leads and safety switch visible; no connection to city main grid or new form. Ren keeps one bare hand on terminal. Noa『街の線とは、切り離す。』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene bleed" id="give-power"><img src="art/11-give-power.png" width="948" height="1659" alt="Ren concentrates faint CYAN energy from chest into isolated lead with BOTH arms UNARMORED, no full armor or attack. Bellows starts first small motion, he sacrifices combat output. Ren『戦う力は、あとでいい。』"></figure><div class="pause" aria-hidden="true" style="--pause:33.33cqw"></div><figure class="scene right" id="rook-guard"><img src="art/12-rook-guard.png" width="1122" height="1402" alt="Rook silver armor blue cape holds steel shield against workshop door under guards&#x27; blows, protects exhausted unarmored Ren inside. No miraculous limitless power. "></figure><div class="pause" aria-hidden="true" style="--pause:24.36cqw"></div><figure class="scene right" id="breath-cue"><img src="art/13-breath-cue.png" width="1448" height="1
