86" alt="Ren pauses with bare hand near vibrating pipe wall, Noa lantern ahead, no captives visible yet. Tiny speech balloon seems from unseen wall. Unseen resident『…出して。』"></figure><div class="pause" aria-hidden="true" style="--pause:184.62cqw"></div><figure class="scene bleed" id="captives"><img src="art/09-captives.png" width="948" height="1659" alt="FIRST reveal silhouettes of living residents moving inside translucent magical transport conduit behind brass protective window. Clear distressed humans, not liquid or gore, destination hidden. Ren Mira Noa foreground aghast. "></figure><div class="pause" aria-hidden="true" style="--pause:30.77cqw"></div><figure class="scene right" id="old-man"><img src="art/10-old-man.png" width="1122" height="1402" alt="Grey-bearded old man in brown vest has crawled out through inspection hatch and collapsed on tunnel walkway, breathing, NOT among the later17-person car convoy. Ren kneels to check him. Ren『聞こえますか。』"></figure><div class="pause" aria-hidden="true" style="--pause:20.51cqw"></div><figure class="scene right" id="patrol"><img src="art/11-patrol.png" width="1448" height="1086" alt="A small brass patrol drone searchlight sweeps toward tunnel fork; Noa spots it, elderly survivor foreground supported by Ren. No giant attack yet. "></figure><div class="pause" aria-hidden="true" style="--pause:15.38cqw"></div><figure class="scene right" id="choose"><img src="art/12-choose.png" width="1122" height="1402" alt="Ren looks from receding transport shadows to elderly man&#x27;s shaky breathing, chooses to pick him up rather than chase. Ren『まず、この人を外へ。』"></figure><div class="pause" aria-hidden="true" style="--pause:24.36cqw"></div><figure class="scene right" id="jam-signal"><img src="art/13-jam-signal.png" width="1448" height="1086" alt="Noa orange gloves remove drone relay fuse at wall access panel, searchlight dims; only hand-tool technology, no future load disperser. Mira records conduit plate. "></figure><div class="pause" aria-hid
