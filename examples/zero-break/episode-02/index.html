round. Mira『この縄を、支えてください。』"></figure><div class="pause" aria-hidden="true" style="--pause:12.82cqw"></div><figure class="scene bleed" id="cross"><img src="art/13-cross.png" width="948" height="1659" alt="Mother and boy cautiously step along held beam, grasping taut safety rope; residents pull rope from safe side, Ren&#x27;s armor cracks while holding weight. They are MIDWAY, not safe yet. "></figure><div class="pause" aria-hidden="true" style="--pause:16.67cqw"></div><figure class="scene right" id="safe"><img src="art/14-safe.png" width="1122" height="1402" alt="Mother and boy now both on dry intact safe ledge, hugging each other, relieved faces. Rope slack, beam still secured, no return to dangerous position. Boy『お母さん…！』"></figure><div class="pause" aria-hidden="true" style="--pause:48.72cqw"></div><figure class="scene right" id="exhale"><img src="art/15-exhale.png" width="1448" height="1086" alt="Ren unarmored again sitting at safe ledge edge, bare hands trembling; Mira kneels beside him with a water cup, no romantic touch. Rescued family behind safely. Ren『よかった…。』"></figure><div class="pause" aria-hidden="true" style="--pause:33.33cqw"></div><figure class="scene right" id="responsibility"><img src="art/16-responsibility.png" width="1122" height="1402" alt="Mira stands between Rook and seated tired Ren. Holds invoice herself, authoritative concern, ruined crown-run aqueduct behind. Ren no armor. Mira『王家の責任です。あなた一人に払わせません。』"></figure><div class="pause" aria-hidden="true" style="--pause:38.46cqw"></div><figure class="scene right" id="cancel"><img src="art/17-cancel.png" width="1448" height="1086" alt="Close Mira places royal ring over the invoice in Rook&#x27;s gloved hands, cancelling the demand by gesture; Ren watches startled, paper unchanged unreadable diagrams. No new text. Rook『…承知しました。』"></figure><div class="pause" aria-hidden="true" style="--pause:30.77cqw"></div><figure class="scene left" id="turn-fragment"><img src="art/18-turn-fragment.png" width="1448" height="1086" alt="Mira turns over the guardian fragment already found in episode1; its outer crown crest turns away; backside still hidden from camera. Ren leans closer, curiosity replaces relief. No workshop number visible yet. "></figure><div class="pause" aria-hidden="true" style="--pause:174.36cqw"></div><figure class="scene left" id="workshop-number"><img src="art/19-workshop-number.png" width="1122" height="1402" alt="FIRST close reveal backside guardian fragment with etched small crown plus exact horizontal plate text 王室工房　七番 . Mira&#x27;s fingertips and surprised eyes behind. Only this label on metal, not a speech balloon. "></figure><div class="pause" aria-hidden="true" style="--pause:43.59cqw"></div><figure class="scene right" id="inside-threat"><img src="art/20-inside-threat.png" width="1122" height="1402" alt="Mira holds revealed fragment, Ren stands beside her looking toward royal white towers with sober expression. No enemy identity shown. Mira『これ、外から来た魔物じゃない。』"></figure><div class="pause" aria-hidden="true" style="--pause:53.85cqw"></div><footer>第2話 おわり<br><a href="../episode-01/index.html">前の話</a><a href="../episode-03/index.html">第3話へ</a></footer></main></html>
