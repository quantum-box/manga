arf. No crystal yet. Rook『ここは、空に浮かぶ国だ。』 Ren『空に……？』 Rook『見慣れない服だな。』 Rook『転生者か。』 Ren『……転生？俺が？』  "></figure><div class="pause" aria-hidden="true" style="--pause:33.33cqw"></div><figure class="scene bleed" id="e01-instruction" style="--width:100%"><img src="art/v6-instruction.png" width="724" height="2172" alt="Rook leads Ren ON FOOT across SAME intact lower balcony plaza. Side/three-quarter view of ONE Ren and ONE Rook walking the same direction; knight half a pace ahead right points forward. Ahead is ornate pointed silver stone pedestal and large BLACK faceted crystal, identical design to reference2. Add a SMALL NARROW FLAT METAL readout INSET on pedestal front, totally BLANK. High bridge in background, cargo awnings below rail. No results, giant, blue power. Ren LEFT and Rook RIGHT beside SAME assessment crystal. Rook&#x27;s BLACK GLOVED finger points to top of black crystal. Ren&#x27;s BARE hands stay lowered, NO TOUCH yet. Crystal in foreground center bottom. Narrow flat inset readout front totally blank, neutral daylight reflections no emitted glow. Both faces and hands clear. Rook『異世界から来た者は、まず魔力を測る。』 Rook『こっちだ。』 Rook『水晶に手を置け。』 Rook offscreen『使える魔力の量がわかる。』  "></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene left" id="hesitation" style="--width:100%"><img src="art/a08-hesitation.png" width="1122" height="1402" alt="自分にも魔力があるか期待と戸惑いが混ざる Ren thought『俺にも、そんな力が……？』  "></figure><div class="pause" aria-hidden="true" style="--pause:28.21cqw"></div><figure class="scene right" id="touch" style="--width:78%"><img src="art/sfx-a09-touch.png" width="1448" height="1086" alt="初めて手を置く動作を見せる   効果音『ぺた』"></figure><div class="pause" aria-hidden="true" style="--pause:6.41cqw"></div><figure class="scene bleed" id="e01-waiting" style="--width:100%"><img src="art/v6-waiting.png" width="724" height="2171" alt="Ren LEFT and Rook RIGHT at same station AFTER touch. Ren&#x27;s BARE RIGHT palm stays flat ON TOP of crystal. He looks to Rook, who ure class="scene bleed" id="e01-danger" style="--width:100%"><img src="art/sfx-v6-danger-geography.png" width="724" height="2172" alt="The SAME giant black stone guardian, armored stone limbs, violet fissures and a violet diamond-shaped chest core, goes berserk and breaks a high stone bridge. Princess Mira small but identifiable ON bridge, before falling. Establish high bridge above a lower balcony (Ren&#x27;s assessment level) above a broad cargo canvas awning and soft cargo on a lower plaza. Two warning voices from small background guards or offscreen; no extra main characters. Giant fills upper background. warning guard A『警備巨兵が暴走した！』 warning guard B『姫様が、橋にいる！』  効果音『ゴゴゴ…』 効果音『バキバキッ！』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene bleed" id="fall" style="--width:100%"><img src="art/sfx-07-fall.png" width="887" height="1774" alt="崩れた橋から天幕に向かって落下するミラ。 Mira『誰か——！』  効果音『ヒュウウッ』"></figure><div class="pause" aria-hidden="true" style="--pause:10.26cqw"></div><figure class="scene left" id="leap" style="--width:94%"><img src="art/sfx-08-leap.png" width="1024" height="1536" alt="低いバルコニーからミラへ手を伸ばし、飛び出すレン。 Ren thought『魔力がなくても、手くらい、伸ばせる。』  効果音『バッ！』"></figure><div class="pause" aria-hidden="true" style="--pause:6.41cqw"></div><figure class="scene bleed" id="e01-catch" style="--width:100%"><img src="art/sfx-v6-catch.png" width="1122" height="1402" alt="Ren catches Mira in midair with bare arms before landing. Ren『つかまって！』  効果音『ギュッ！』 効果音『バサァッ』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw"></div><figure class="scene wide" id="landing" style="--width:100%"><img src="art/10-landing.png" width="1122" height="1402" alt="荷物用の天幕へ落ちた二人。布と荷物が衝撃を受け止める。 Ren thought『……生きてる。』  効果音『ドサッ。』"></figure><div class="pause" aria-hidden="true" style="--pause:41.03cqw"></div><figure class="scene bleed" id="e01-safe-01" style="--width:100%"><img src="art/v6-safe-01.png" width="724" height="2172" alt="Same lower cargo plaza after
