<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゼロブレイク — 装着シーンの余白演出</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}main{width:100%;max-width:480px;margin:auto}figure{margin:0}img{display:block;width:100%;height:auto}.pause{width:100%;aspect-ratio:390 / var(--height)}
</style></head><body><main aria-label="ゼロブレイク・装着シーンの演出試作">
<figure id="route"><img src="art/route.png" width="887" height="1774" alt="胸の核から裸の腕へ光が走り、手首に格子が現れる。システム「装甲展開、開始。」、音「シュウウ…」。"></figure>
<div class="pause" style="--height:60" aria-hidden="true" data-pacing-purpose="手首の格子から固定の音まで、小さな間"></div>
<figure id="sound"><img src="art/sound.png" width="1254" height="1254" alt="白い余白に、手首の留め具の音「カチッ」だけ。"></figure>
<div class="pause" style="--height:80" aria-hidden="true" data-pacing-purpose="固定された瞬間を受け止める"></div>
<figure id="voice"><img src="art/voice.png" width="1254" height="1254" alt="白い余白にシステムの通知「接続完了。」だけ。縦書き、枠なし。"></figure>
<div class="pause" style="--height:100" aria-hidden="true" data-pacing-purpose="接続完了を聞いて、姿を待つ"></div>
<figure id="light"><img src="art/light.png" width="1024" height="1536" alt="白い余白を、細いシアンの光だけが下へ流れる。人物はまだ見えない。"></figure>
<div class="pause" style="--height:120" aria-hidden="true" data-pacing-purpose="光が消えてから、全身が初めて現れるまで"></div>
<figure id="hero"><img src="art/hero.png" width="887" height="1774" alt="黒い装甲、シアンの核と継ぎ目、赤いマフラーのレン。ミラは後ろで安全に立つ。レン「なら、今度こそ。」、音「ガキンッ！」。"></figure>
<div class="pause" style="--height:100" aria-hidden="true" data-pacing-purpose="完成した姿の余韻"></div>
</main></body></html>
