ight" id="footsteps"><img src="art/a01-footsteps.png" width="1448" height="1086" alt="銀の靴音に気づく "></figure><div class="pause" aria-hidden="true" style="--pause:11.54cqw;--paper:#f7fbff"></div><figure class="scene wide" id="knight_arrives"><img src="art/a02-knight-arrives.png" width="1122" height="1402" alt="騎士が遠くから近づく "></figure><div class="pause" aria-hidden="true" style="--pause:16.67cqw;--paper:#f7fbff"></div><figure class="scene left" id="greeting"><img src="art/a03-greeting.png" width="1122" height="1402" alt="騎士が声をかけ、レンが答える Rook『立てるか？』 Ren『ああ……。ここは？』"></figure><div class="pause" aria-hidden="true" style="--pause:21.79cqw;--paper:#f7fbff"></div><figure class="scene wide" id="orientation"><img src="art/a04-orientation.png" width="1024" height="1536" alt="レンが立ち上がり、空の国を見直す Rook『ここは、空に浮かぶ国だ。』 Ren『空に……？』"></figure><div class="pause" aria-hidden="true" style="--pause:30.77cqw;--paper:#f7fbff"></div><figure class="scene right" id="registration"><img src="art/a05-registration.png" width="1122" height="1402" alt="見慣れない服から転生者と判断される Rook『見慣れない服だな。転生者か。』 Ren『……転生？俺が？』"></figure><div class="pause" aria-hidden="true" style="--pause:23.08cqw;--paper:#f7fbff"></div><figure class="scene wide" id="walk_to_station"><img src="art/a06-walk-to-station.png" width="1024" height="1536" alt="測定の理由を聞き、装置まで歩いて行く Rook『異世界から来た者は、まず魔力を測る。こっちだ。』"></figure><div class="pause" aria-hidden="true" style="--pause:12.82cqw;--paper:#f7fbff"></div><figure class="scene wide" id="instruction"><img src="art/a07-instruction.png" width="1122" height="1402" alt="立ち位置と測る方法を確かめる Rook『水晶に手を置け。使える魔力の量がわかる。』"></figure><div class="pause" aria-hidden="true" style="--pause:17.95cqw;--paper:#f7fbff"></div><figure class="scene left" id="hesitation"><img src="art/a08-hesitation.png" width="1122" height="1402" alt="自分にも魔力があるか期待と戸惑いが混ざる Ren thought『俺にも、そんな力が……？』"></figure><div class="pause" aria-hidden="true" style="--pause:28.21cqw;--paper:#f7fbff"></div><figure class="scene right" id="touch"><img src="art/a09-touch.png" width="1448" height="1086" alt="初めて手を置く動作を見せる "></figure><div class="pause" aria-hidden="true" style="--pause:6.41cqw;--paper:#f7fbff"></div><figure class="scene wide" id="waiting"><img src="art/a10-waiting.png" width="1122" height="1402" alt="手を置いたまま測定を待つ Ren『……これで、いいのか？』 Rook『そのまま、待て。』"></figure><div class="pause" aria-hidden="true" style="--pause:138.46cqw;--paper:#f7fbff"></div><figure class="scene right" id="result"><img src="art/a11-result.png" width="1254" height="1254" alt="同じ測定器の表示部へ寄ると、魔力量０が初めて表示される。 measurement device『魔力量０』"></figure><div class="pause" aria-hidden="true" style="--pause:30.77cqw;--paper:#f7fbff"></div><figure class="scene wide" id="confirmation"><img src="art/a12-confirmation.png" width="1122" height="1402" alt="結果を口にされ、レンが聞き返す Rook『魔力、ゼロ。』 Ren『……ゼロ？』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw;--paper:#f7fbff"></div><figure class="scene wide" id="stakes"><img src="art/a13-stakes.png" width="1122" height="1402" alt="ゼロが何を意味するか説明される Rook『この国では、魔力がない者は戦えない。』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw;--paper:#f7fbff"></div><figure class="scene right" id="rejection"><img src="art/a14-rejection.png" width="1122" height="1402" alt="騎士が背を向ける Rook『ハズレの転生者か。』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw;--paper:#f7fbff"></div><figure class="scene left" id="zero_reaction"><img src="art/a15-zero-reaction.png" width="1122" height="1402" alt="レンが結果を受け止める Ren thought『……ここでも、何もできないのか。』"></figure><div class="pause" aria-hidden="true" style="--pause:56.41cqw;--paper:#f7fbff"></div><figure class="scene right" id="tremor"><img src="art/a16-tremor.png" width="1448" height="1086" alt="静かな落胆のあと足元に異変が起きる "></figure><div class="pause" aria-hidden="true" style="--pause:21.79cqw;--paper:#f7fbff"></div><figure class="scene wide" id="giant"><img src="art/06-giant.png" width="1024" height="1536" alt="警備巨兵が橋を壊す。上のミラと下の荷物用の天幕。 warning guard A『警備巨兵が暴走した！』 warning guard B『姫様が、橋にいる！』"></figure><div class="pause" aria-hidden="true" style="--pause:10.26cqw;--paper:#f7fbff"></div><figure class="scene bleed" id="fall"><img src="art/07-fall.png" width="887" height="1774" alt="崩れた橋から天幕に向かって落下するミラ。 Mira『誰か——！』"></figure><div class="pause" aria-hidden="true" style="--pause:10.26cqw;--paper:#f7fbff"></div><figure class="scene left" id="leap"><img src="art/08-leap.png" width="1024" height="1536" alt="低いバルコニーからミラへ手を伸ばし、飛び出すレン。 Ren thought『魔力がなくても、手くらい、伸ばせる。』"></figure><div class="pause" aria-hidden="true" style="--pause:6.41cqw;--paper:#f7fbff"></div><figure class="scene right" id="catch"><img src="art/09-catch.png" width="1122" height="1402" alt="未変身のレンが両腕でミラを抱きとめる。 Ren『つかまって！』"></figure><div class="pause" aria-hidden="true" style="--pause:5.13cqw;--paper:#f7fbff"></div><figure class="scene wide" id="landing"><img src="art/10-landing.png" width="1122" height="1402" alt="荷物用の天幕へ落ちた二人。布と荷物が衝撃を受け止める。 Ren thought『……生きてる。』"></figure><div class="pause" aria-hidden="true" style="--pause:41.03cqw;--paper:#f7fbff"></div><figure class="scene wide" id="safe"><img src="art/11-safe.png" width="1024" height="1536" alt="ミラが安全に立ち、膝をついたレンへ礼を言う。 Mira『ありがとう。私はミラ。この国の王女よ。』 Ren『レンだ。無事なら、それで。』"></figure><div class="pause" aria-hidden="true" style="--pause:38.46cqw;--paper:#f7fbff"></div><figure class="scene wide" id="approach"><img src="art/12-approach.png" width="948" height="1659" alt="同じ巨兵が迫り、未変身のレンがミラを背後にかばう。 Ren thought『まだ、来るのか。』 Ren『ミラ、下がって。今度は俺が止める。』"></figure><div class="pause" aria-hidden="true" style="--pause:28.21cqw;--paper:#f7fbff"></div><div class="transition to-dark" aria-hidden="true"></div><figure class="scene dark" id="core"><img src="art/13-core.png" width="948" height="1659" alt="胸の青い光。救命行動の確認、核の起動、装甲名の通知。 Ren thought『これは……？』 system『救命行動を確認。救済核、起動。』 system『装甲名：ゼロ・ブレイク』"></figure><div class="pause" aria-hidden="true" style="--pause:115.38cqw;--paper:#0c1e2e"></div><div class="transition to-light" aria-hidden="true"></div><figure class="scene bleed" id="hero"><img src="art/14-hero.png" width="887" height="1774" alt="黒い装甲と青い星形の核を持つレンの全身が初めて現れる。 Ren『なら、今度こそ。』"></figure><div class="pause" aria-hidden="true" style="--pause:15.38cqw;--paper:#f7fbff"></div><figure class="scene wide" id="punch"><img src="art/15-punch.png" width="1122" height="1402" alt="巨兵の紫の胸の核を、レンが装甲の拳で打ち砕く。 Ren『ゼロ・ブレイク！』"></figure><div class="pause" aria-hidden="true" style="--pause:58.97cqw;--paper:#f7fbff"></div><figure class="scene wide" id="relief"><img src="art/16-relief.png" width="1024" height="1536" alt="巨兵が止まり、二人が安全な地面で笑う。 Mira『あなた、本当に魔力ゼロなの？』 Ren『みたいだ。けど、役立たずじゃなかった。』"></figure><div class="pause" aria-hidden="true" style="--pause:58.97cqw;--paper:#f7fbff"></div><figure class="scene left" id="fragment"><img src="art/17-fragment.png" width="1024" height="1536" alt="装甲の掌の破片に、王冠の紋章が現れる。 Mira offscreen『その紋章……王家の工房のものよ。』 Ren offscreen『じゃあ、なんで俺たちを襲った？』"></figure><div class="pause" aria-hidden="true" style="--pause:25.64cqw;--paper:#f7fbff"></div><footer>第1話 おわり<br><a href="../episode-02/index.html">第2話「英雄の請求書」へ</a></footer></main></html>
