<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゼロブレイク — 救出後の会話・コマ分け試作</title>
  <style>
    *{box-sizing:border-box}html{background:#f7f5ef;color:#252525;font-family:system-ui,sans-serif}
    body{margin:0}header{max-width:600px;margin:auto;padding:18px 16px 22px}
    h1{font-size:20px;line-height:1.5;margin:0 0 8px}p{line-height:1.7;margin:8px 0}
    .status{font-size:14px;color:#5b5549}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    button{font:inherit;font-size:16px;background:white;border:1px solid #9b968b;border-radius:7px;padding:10px 14px;cursor:pointer}
    button[aria-pressed="true"]{background:#273f51;color:white;border-color:#273f51}
    main{width:100%;max-width:390px;margin:auto}figure{margin:0}img{display:block;width:100%;height:auto}
    .pause{height:70px;background:#f7f5ef}.end{padding:22px 16px 40px;font-size:15px}
    [hidden]{display:none!important}:focus-visible{outline:3px solid #1493bd;outline-offset:3px}
  </style>
</head>
<body>
  <header>
    <h1>ゼロブレイク<br>救出後の会話・コマ分け試作</h1>
    <p class="status">2026-10-06、コマの大小と枠を変えた版を採用。初稿・原画と比較できます。</p>
    <p>同じ8コマに大小をつけ、短い目元の反応と、大きく見せる名乗り・返事を読み進めます。</p>
    <nav aria-label="比較する版">
      <button type="button" data-version="after" aria-pressed="true">大小をつけた8コマ</button>
      <button type="button" data-version="initial" aria-pressed="false">分割した初稿：8コマ</button>
      <button type="button" data-version="before" aria-pressed="false">修正前：1コマ</button>
    </nav>
  </header>
  <main>
    <section id="after" aria-label="大小と枠を変えた再改稿、8コマ">
      <figure><img src="varied-01.png" width="724" height="2172" alt="大きな全景で二人の安全を確認。右寄せの小さめのミラの顔、ありがとう。左寄せの浅い横長コマでレンの目元の反応、無言。大きな縦長コマで胸元へ手を添えるミラ、私はミラ。"></figure>
      <div class="pause" aria-hidden="true"></div>
      <figure><img src="varied-02.png" width="724" height="2171" alt="中くらいの手元のコマ、ミラ、この国の王女よ。左寄せの浅い横長コマでレンの目元が小さく驚く、無言。右寄せの縦長コマで自分を示すレン、レンだ。枠を外した大きなレンの上半身、無事なら、それで。"></figure>
      <p class="end">救出後の自己紹介までの試作です。</p>
    </section>
    <section id="initial" aria-label="最初に会話を分けた8コマ" hidden>
      <figure><img src="after-01.png" width="724" height="2172" alt="コマ1、破れた荷物用の天幕の跡でレンは膝をつき、ミラは安全な地面に立つ。コマ2、ミラの顔、ありがとう。コマ3、礼を聞いて安堵するレンの顔、無言。コマ4、胸元へ手を添えるミラ、私はミラ。"></figure>
      <div class="pause" aria-hidden="true"></div>
      <figure><img src="after-02.png" width="724" height="2172" alt="コマ5、同じミラの手と服へ寄る、この国の王女よ。コマ6、レンが身分を受け止めて小さく驚く、無言。コマ7、自分を示すレン、レンだ。コマ8、同じ低い姿勢で安堵するレン、無事なら、それで。"></figure>
      <p class="end">救出後の自己紹介までの試作です。</p>
    </section>
    <section id="before" aria-label="修正前、1コマ" hidden>
      <figure><img src="before-safe.png" width="1024" height="1536" alt="破れた天幕の前で、立つミラと膝をつくレンを一緒に描いた1コマ。ミラ、ありがとう。私はミラ。この国の王女よ。レン、レンだ。無事なら、それで。"></figure>
      <p class="end">礼・名前・身分・返答を1コマに収めた原画です。</p>
    </section>
  </main>
  <script>
    for (const button of document.querySelectorAll('[data-version]')) {
      button.addEventListener('click', () => {
        for (const section of document.querySelectorAll('main section')) section.hidden = section.id !== button.dataset.version;
        for (const item of document.querySelectorAll('[data-version]')) item.setAttribute('aria-pressed', String(item === button));
      });
    }
  </script>
</body>
</html>
