<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第11話 帰り道の報告｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第11話 帰り道の報告</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:13.88889cqw"><img src="art/01.webp" width="887" height="1774" alt="城の低い水路を点検し、魔王が測り棒をミラへ渡す。PR：少しずつ、ね。／PO内心：俺も点検係？／DK：増やすなよ。／PO内心：帰って報告だ。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:27.77778cqw"><img src="art/02.webp" width="887" height="1774" alt="朝の森の道、ミラが先へ急ぎ、ポチは短い足で追いかける。PO内心：待って、歩幅！／PR：ごめん、休もう。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:44.44444cqw"><img src="art/03.webp" width="887" height="1774" alt="日陰の石で休むポチ、ミラが水を器へ注ぎ犬の届く場所に置く。PR：ここなら届く？／PO内心：気づいてくれた。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:15.27778cqw"><img src="art/04.webp" width="887" height="1774" alt="以前渡った浅瀬の岸、ミラが測り棒で深さを確かめる。PR：昨日より深い。／PO内心：泳ぐのは無理だ。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:52.77778cqw"><img src="art/05.webp" width="887" height="1774" alt="ミラが腹と胸を支えてポチを抱き、石を確かめながら浅瀬を渡る。PR：揺れるよ。／PO内心：頼む、落とすな。"></figure>
<figure id="scene-06" data-artwork="art/06-village.webp" style="--after:25.00000cqw"><img src="art/06-village.webp" width="887" height="1774" alt="村の入口に着き、トトが走り寄り途中で足を止めて両手を開く。TO：おかえり！／PO内心：帰る場所、か。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:63.88889cqw"><img src="art/07.webp" width="887" height="1774" alt="トトが桶にたまった水を見せ、ミラが測り棒の目盛りと比べる。TO：ちゃんと来たよ。／PR：よかった……。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:40.27778cqw"><img src="art/08.webp" width="887" height="1774" alt="村人が壊れた高い水路を指し、ミラが低い水路だけの流れを説明する。PR：まだ直ってない。／PO内心：喜びすぎたか。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:43.05556cqw"><img src="art/09.webp" width="887" height="1774" alt="村の家でミラが木板に水量の線を引き、トトが桶を並べ直す。PR：この線までね。／TO：ぼくも見てる。"></figure>
<figure id="scene-10" data-artwork="art/10-village.webp" style="--after:119.44444cqw"><div class="panel-window" data-panels="1-2" data-source-region="{&quot;upper&quot;:[[0,0],[360,0]],&quot;lower&quot;:[[0,350],[360,350]]}" style="aspect-ratio:360/350.00000;--source-top:0.00000%;clip-path:polygon(0.00000% 0.00000%,100.00000% 0.00000%,100.00000% 100.00000%,0.00000% 100.00000%)"><img src="art/10-village.webp" width="887" height="1774" alt="夕暮れの窓辺でポチが眠りかけ、戸外から小さな鳴き声を聞く。PO内心：今日はもう……。"></div><div class="pause" aria-hidden="true" data-purpose="眠りかけた静けさを保ち、まだ正体の見えない鳴き声を次のスクロールで出す" style="--pause:50.00000cqw"></div><div class="panel-window" data-panels="3-3" data-source-region="{&quot;upper&quot;:[[0,350],[360,350]],&quot;lower&quot;:[[0,510.5],[360,510.5]]}" style="aspect-ratio:360/160.50000;--source-top:-218.06854%;clip-path:polygon(0.00000% 0.00000%,100.00000% 0.00000%,100.00000% 100.00000%,0.00000% 100.00000%)"><img src="art/10-village.webp" width="887" height="1774" alt="夕暮れの窓辺でポチが眠りかけ、戸外から小さな鳴き声を聞く。無言の動作。"></div><div class="pause" aria-hidden="true" data-purpose="戸外の小さな声を聞いてから、ポチが目を開けるまでの反応の間" style="--pause:23.61111cqw"></div><div class="panel-window" data-panels="4-4" data-source-region="{&quot;upper&quot;:[[0,510.5],[360,510.5]],&quot;lower&quot;:[[0,720.0],[360,720.0]]}" style="aspect-ratio:360/209.50000;--source-top:-243.67542%;clip-path:polygon(0.00000% 0.00000%,100.00000% 0.00000%,100.00000% 100.00000%,0.00000% 100.00000%)"><img src="art/10-village.webp" width="887" height="1774" alt="夕暮れの窓辺でポチが眠りかけ、戸外から小さな鳴き声を聞く。PO内心：今の声、誰だ？"></div></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-10/index.html">前の話</a> <a href="../episode-12/index.html">次の話</a></nav><p>第11話 おわり</p></footer></main></body></html>
