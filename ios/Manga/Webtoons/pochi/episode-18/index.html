<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18話 雨のにおい｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第18話 雨のにおい</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:44.44444cqw"><img src="art/01.webp" width="887" height="1774" alt="朝の村でポチが風を嗅ぎ、空はまだ明るいのに耳を伏せる。PO内心：嫌なにおいだ。／TO：眠いの？"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:27.77778cqw"><img src="art/02.webp" width="887" height="1774" alt="ミラが空と布の風向きを見て、村長へ天気を尋ねる。PR：雨はいつ？／村長：夕方の予報だ。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:37.50000cqw"><img src="art/03.webp" width="887" height="1774" alt="城への道でポチが湿った地面を避け、ミラが靴で泥を確かめる。PO内心：昨日より柔らかい。／PR：足元も変わるね。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:19.44444cqw"><img src="art/04.webp" width="887" height="1774" alt="魔王が貯水池の線を示し、水位はまだ低いと伝える。DK：今は余裕がある。／PR：今は、ね。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:26.38889cqw"><img src="art/05.webp" width="887" height="1774" alt="大工が資材に布をかけ、村から来た職人が縄を締める。大工：濡らす前に包め。／職人：こっちも終わり。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:63.88889cqw"><img src="art/06.webp" width="887" height="1774" alt="遠い雷にポチが震え、ミラが屋根のある待機場所へ誘う。PR：中に入ろう。"></figure>
<figure id="scene-07" data-artwork="art/07-rain.webp" style="--after:55.55556cqw"><div class="panel-window" data-panels="1-2" data-source-region="{&quot;upper&quot;:[[0,0],[360,0]],&quot;lower&quot;:[[0,359.39120631341603],[360,359.39120631341603]]}" style="aspect-ratio:360/359.39121;--source-top:0.00000%;clip-path:polygon(0.00000% 0.00000%,100.00000% 0.00000%,100.00000% 100.00000%,0.00000% 100.00000%)"><img src="art/07-rain.webp" width="887" height="1774" alt="ポチが怖くて動けず、ミラが低く座って待つ。PR：ここにいるよ。"></div><div class="pause" aria-hidden="true" data-purpose="怖くて足が動かない犬を急かさず待つ" style="--pause:47.22222cqw"></div><div class="panel-window" data-panels="3-4" data-source-region="{&quot;upper&quot;:[[0,359.39120631341603],[360,359.39120631341603]],&quot;lower&quot;:[[0,720.0],[360,720.0]]}" style="aspect-ratio:360/360.60879;--source-top:-99.66235%;clip-path:polygon(0.00000% 0.00000%,100.00000% 0.00000%,100.00000% 100.00000%,0.00000% 100.00000%)"><img src="art/07-rain.webp" width="887" height="1774" alt="ポチが怖くて動けず、ミラが低く座って待つ。PO内心：足が動かない。"></div></figure>
<figure id="scene-08" data-artwork="art/08-rain.webp" style="--after:38.88889cqw"><img src="art/08-rain.webp" width="887" height="1774" alt="ポチがミラの足元へ一歩寄り、屋根の下へ歩く。PO内心：一歩だけ。／PR：うん、そのまま。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:58.33333cqw"><img src="art/09.webp" width="887" height="1774" alt="雨が屋根を打ち、魔王と村長が水位を測り直す。村長：線が上がった。／DK：放流を絞る。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:138.88889cqw"><img src="art/10.webp" width="887" height="1774" alt="安全な屋根の下でポチが落ち着き、暗い水路の奥で流木の音を聞く。PO内心：今のは雷じゃない。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-17/index.html">前の話</a> <a href="../episode-19/index.html">次の話</a></nav><p>第18話 おわり</p></footer></main></body></html>
