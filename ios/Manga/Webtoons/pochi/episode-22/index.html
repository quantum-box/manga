<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第22話 名前で呼んで｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第22話 名前で呼んで</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:41.66667cqw"><img src="art/01.webp" width="887" height="1774" alt="会議の後、トトが魔王に何と呼べばよいか尋ねる。TO：なんて呼ぶの？／DK：魔王でいい。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:55.55556cqw"><img src="art/02.webp" width="887" height="1774" alt="村人が魔王へ水門の昔の出来事を問い、魔王が言葉を選ぶ。村人：なぜ閉めた？／DK：壊れたからだ。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:47.22222cqw"><img src="art/03.webp" width="887" height="1774" alt="ミラが魔王に説明を急がせず、図を机へ広げる。PR：ここから教えて。／DK：この継ぎ目だ。"></figure>
<figure id="scene-04" data-artwork="art/04-continuity.webp" style="--after:52.77778cqw"><img src="art/04-continuity.webp" width="887" height="1774" alt="魔王が破断した高い水路を描き、村長が村の位置を示す。DK：水が落ちる先だ。／村長：うちの屋根か。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:66.66667cqw"><img src="art/05.webp" width="887" height="1774" alt="村人が水を奪われたと思っていたことを伝える。村人：疑っていた。／DK：知っている。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:44.44444cqw"><img src="art/06.webp" width="887" height="1774" alt="トトがポチも吠えて怖がったことを思い出す。TO：ポチも怖かったよ。／PO内心：それは内緒に！"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:58.33333cqw"><img src="art/07.webp" width="887" height="1774" alt="魔王がポチを見て目を緩め、指を下げて匂いを嗅がせる。DK：お前もか。／PO内心：お互い様だ。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:63.88889cqw"><img src="art/08.webp" width="887" height="1774" alt="トトが自分を名前で呼んでほしいと伝える。TO：ぼくはトト。／DK：分かった、トト。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:44.44444cqw"><img src="art/09.webp" width="887" height="1774" alt="村長が魔王という呼び方でよいか本人に改めて確かめる。村長：そう呼んでいいか？／DK：今は、それでいい。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:136.11111cqw"><img src="art/10.webp" width="887" height="1774" alt="帰りの門で魔王がトトに短く手を振り、ポチが横で尻尾を振る。DK：またな、トト。／PO内心：一つ覚えたな。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-21/index.html">前の話</a> <a href="../episode-23/index.html">次の話</a></nav><p>第22話 おわり</p></footer></main></body></html>
