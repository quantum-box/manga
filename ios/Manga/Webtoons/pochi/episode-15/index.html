<figure id="scene-02" data-artwork="art/02.webp" style="--after:43.05556cqw"><img src="art/02.webp" width="887" height="1774" alt="門がゆっくり開き魔王が敷居の内側に立つ。DK：道具を見せろ。／大工：まず挨拶だろ。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:19.44444cqw"><img src="art/03.webp" width="887" height="1774" alt="張り詰めた二人の間でミラが訪問の目的を言い直す。PR：点検に来ました。／村長：村の者です。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:48.61111cqw"><img src="art/04.webp" width="887" height="1774" alt="ポチが急いで吠えかけ、座って相手の顔を見上げる。PO内心：吠えるな、俺。／DK：その犬は通せ。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:27.77778cqw"><img src="art/05.webp" width="887" height="1774" alt="大工が道具袋を開き、魔王が刃の数を確かめる。大工：隠し物はない。／DK：確認した。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:50.00000cqw"><img src="art/06.webp" width="887" height="1774" alt="魔王が壊れた高い水路へ案内し、大工が安全な足場で止まる。DK：ここから先は危険だ。／大工：よく支えたな。"></figure>

<figure id="scene-08" data-artwork="art/08.webp" style="--after:61.11111cqw"><img src="art/08.webp" width="887" height="1774" alt="村長が低い迂回水路の水量を測り、ミラと数値を確かめる。村長：村の線と同じだ。／PR：続いてるね。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:38.88889cqw"><img src="art/09.webp" width="887" height="1774" alt="大工と魔王が木板へ別々に図を書き、同じ割れを指す。大工：根元から直す。／DK：同意する。"></figure>
