<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第16話 足元の設計図｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第16話 足元の設計図</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:33.33333cqw"><img src="art/01.webp" width="887" height="1774" alt="村の作業場で大工が修理の図面を広げ、ミラが資材を数える。大工：新しい梁が要る。／PR：何本？"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:18.05556cqw"><img src="art/02.webp" width="887" height="1774" alt="ポチが図面を見上げても机の上が見えず、トトが床へ写す。TO：ここなら見える？／PO内心：部下思いだな。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:52.77778cqw"><img src="art/03.webp" width="887" height="1774" alt="床の模型にポチが鼻を寄せ、以前の失敗を思い出す。PO内心：また練習からだ。／TO：壊しても平気。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:33.33333cqw"><img src="art/04.webp" width="887" height="1774" alt="城の点検路で魔王が大工を案内し、ポチが下から支柱を嗅ぐ。DK：梁はここだ。／PO内心：変なにおい。"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:47.22222cqw"><img src="art/05.webp" width="887" height="1774" alt="ポチが湿った土台の前で立ち止まり、鼻を引いて吠える。PO：ワン！／PR：そこが気になる？"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:25.00000cqw"><img src="art/06.webp" width="887" height="1774" alt="大工がかがんで小さな刃先を土台へ当て、木が崩れる。大工：中が腐ってる。／DK：外は無傷だ。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:44.44444cqw"><img src="art/07.webp" width="887" height="1774" alt="ミラが全員を安全な点検路へ下げ、大工が図面を訂正する。PR：まず離れよう。／大工：土台からだ。"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:33.33333cqw"><img src="art/08.webp" width="887" height="1774" alt="魔王が昔置いた支柱の位置を指し、自分の見落としを認める。DK：見えていなかった。／PO内心：高さの差、か。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:58.33333cqw"><img src="art/09.webp" width="887" height="1774" alt="大工が犬と同じ高さで床を見て他の土台も確かめる。大工：低く見るんだな。／PO内心：鼻だけじゃない。"></figure>
