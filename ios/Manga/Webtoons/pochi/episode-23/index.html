<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第23話 なくなった測り棒｜転生したら柴犬だった。</title><link rel="stylesheet" href="reader.css?v=2ad357750ab3"></head><body><main><header><small>転生したら柴犬だった。</small><h1>第23話 なくなった測り棒</h1></header><figure id="scene-01" data-artwork="art/01.webp" style="--after:33.33333cqw"><img src="art/01.webp" width="887" height="1774" alt="村の桶場でミラが測り棒を探し、いつもの石台は空になっている。PR：棒がない。／TO：昨日はあったよ。"></figure>
<figure id="scene-02" data-artwork="art/02.webp" style="--after:55.55556cqw"><img src="art/02.webp" width="887" height="1774" alt="村人が城の職人を疑いかけ、村長が作業を確認しようと止める。村人：持って帰った？／村長：まず探そう。"></figure>
<figure id="scene-03" data-artwork="art/03.webp" style="--after:26.38889cqw"><img src="art/03.webp" width="887" height="1774" alt="ミラが最後に置いた場所を指し、ポチが石台を嗅ぐ。PR：ここへ置いたの。／PO内心：証言、ひとつ。"></figure>
<figure id="scene-04" data-artwork="art/04.webp" style="--after:36.11111cqw"><img src="art/04.webp" width="887" height="1774" alt="トトが昨日桶を移した時の泥跡を見つける。TO：桶も動かした。／PO内心：棒も動いた？"></figure>
<figure id="scene-05" data-artwork="art/05.webp" style="--after:44.44444cqw"><img src="art/05.webp" width="887" height="1774" alt="ポチが濡れた足跡をたどり、薪置き場の前で止まる。PO内心：においが続く。／PR：こっちなの？"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:52.77778cqw"><img src="art/06.webp" width="887" height="1774" alt="薪置き場で別の棒が見つかり、ミラが目盛りのない端を確かめる。PR：これは違うね。／PO内心：鼻も間違う。"></figure>
<figure id="scene-07" data-artwork="art/07.webp" style="--after:38.88889cqw"><img src="art/07.webp" width="887" height="1774" alt="大工が雨避けの布をめくり、資材の下から目盛り付きの棒を見つける。大工：ここへ避けた。／PR：見つかった！"></figure>
<figure id="scene-08" data-artwork="art/08.webp" style="--after:63.88889cqw"><img src="art/08.webp" width="887" height="1774" alt="大工が濡れないよう片づけたが伝えていなかったと説明する。大工：言い忘れた。／村長：分かってよかった。"></figure>
<figure id="scene-09" data-artwork="art/09.webp" style="--after:41.66667cqw"><img src="art/09.webp" width="887" height="1774" alt="疑った村人が城の職人へ頭を下げ、職人が手を振る。村人：すまなかった。／職人：次は一緒に探そう。"></figure>
<figure id="scene-10" data-artwork="art/10.webp" style="--after:125.00000cqw"><img src="art/10.webp" width="887" height="1774" alt="ミラが棒の置き場所を高い棚の一か所へ決める。PR：戻す場所はここ。／PO内心：仕組みで防ぐ、か。"></figure><footer><nav><a href="../chapters.html">話一覧</a> <a href="../episode-22/index.html">前の話</a> <a href="../episode-24/index.html">次の話</a></nav><p>第23話 おわり</p></footer></main></body></html>
