<figure id="scene-04" data-artwork="art/04.webp" style="--after:50.00000cqw"><img src="art/04.webp" width="887" height="1774" alt="ポチが継ぎ目から落ちる一滴を見て耳を動かす。PO内心：ここ、漏れてる？"></figure>

<figure id="scene-06" data-artwork="art/06.webp" style="--after:61.11111cqw"><img src="art/06.webp" width="887" height="1774" alt="職人が喜びかけた手を下ろし、大工が流れの止まるまで待たせる。職人：失敗ですか？／大工：まず確かめる。"></figure>

<figure id="scene-09" data-artwork="art/09.webp" style="--after:66.66667cqw"><img src="art/09.webp" width="887" height="1774" alt="ミラが村へ試験中断の旗を示し、丘のトトが村長へ伝える。TO：赤い旗だ。／村長：まだ降りない。"></figure>
