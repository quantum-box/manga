<figure id="scene-02" data-artwork="art/02-rain.webp" style="--after:47.22222cqw"><img src="art/02-rain.webp" width="887" height="1774" alt="魔王が作業者の数を確認し、ミラがポチを待機石へ誘導する。DK：全員、離れろ。／PR：こっちへ。"></figure>
<figure id="scene-03" data-artwork="art/03-rain.webp" style="--after:52.77778cqw"><img src="art/03-rain.webp" width="887" height="1774" alt="安全な屋根から見た水路の曲がり角に流木が引っかかる。PR：木が詰まってる。／PO内心：見えた、あれだ。"></figure>
<figure id="scene-04" data-artwork="art/04-rain.webp" style="--after:30.55556cqw"><img src="art/04-rain.webp" width="887" height="1774" alt="村の職人が棒で取ろうとし、大工が腕を止める。職人：届きそうだ。／大工：水へ出るな。"></figure>
<figure id="scene-05" data-artwork="art/05-rain.webp" style="--after:69.44444cqw"><img src="art/05-rain.webp" width="887" height="1774" alt="魔王が上流の水門を閉め、ミラが流れが弱まるまで待つ。DK：閉じた。／PR：まだ待って。"></figure>
<figure id="scene-06" data-artwork="art/06.webp" style="--after:44.44444cqw"><img src="art/06.webp" width="887" height="1774" alt="雨に混じって流木が動き、ポチが毛布の上で息を整える。PO内心：止めてよかった。／PR：声、届いたよ。"></figure>
<figure id="scene-07" data-artwork="art/07-rain.webp" style="--after:37.50000cqw"><img src="art/07-rain.webp" width="887" height="1774" alt="水が落ち着いてから大工が長い鉤で岸から流木を寄せる。大工：足場を見てくれ。／職人：動いてない。"></figure>
<figure id="scene-08" data-artwork="art/08-rain.webp" style="--after:27.77778cqw"><img src="art/08-rain.webp" width="887" height="1774" alt="魔王と職人が岸から流木を引き上げ、低い水路を空ける。DK：せーの。／職人：取れた！"></figure>
<figure id="scene-09" data-artwork="art/09-rain.webp" style="--after:50.00000cqw"><img src="art/09-rain.webp" width="887" height="1774" alt="ミラが小量の流れを再確認し、ポチが吠えず鼻を動かす。PR：今度は通ってる。／PO内心：鳴かない確認も。"></figure>
