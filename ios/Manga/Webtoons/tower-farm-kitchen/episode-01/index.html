すか？」 係員「何人か、ここで暮らしてる。」 コウ「元の場所に、帰りたいんです。」 "></figure><figure class="scene conversation align-center" id="02-gate" style="--scene-width:100%;--pause:28.21cqw"><img src="art/02-gate-context-clerk.png" width="887" height="1774" alt="THREE unequal shots SAME stall. Upper medium older beige-robed clerk points toward distant unlit shut stone doorway beneath tower ribs, first introduces return gate. Middle small hopeful Kou face asks if returning is possible. Bottom wider clerk speaks gravely, Kou shoulders tense. No map, opening portal, return date, success guarantee, UI or magical source. Word gate has NOT been asked by Kou earlier. Kou RIGHT, clerk LEFT. 係員「帰還の門がある。」 コウ「帰れるんですか？」 係員「今は閉じてる。調査待ちだ。」 "></figure><figure class="scene conversation align-center" id="37-shelter-and-directions" style="--scene-width:100%;--pause:43.59cqw"><img src="art/37-shelter-and-directions-clerk.png" width="724" height="2172" alt="FOUR VARIED quiet beats SAME stall BEFORE Kou leaves. Top medium Kou asks when gate opens. Next small close older beige-robed clerk says he does not know. Next larger medium clerk gestures to plain bench inside his service stall as modest overnight rest room; not inn, no luxury or money. Bottom close Kou quietly thanks him, shoulders ease slightly. No food, job, gate schedule or extra staff. Tall 1:3 canvas, four beats downwards, no uniform grid. コウ「いつ、開くんですか？」 係員「まだ、分からない。」 係員「今夜は、ここの休憩室でいい。」 コウ「……ありがとうございます。」 "></figure><figure class="scene continuous align-center" id="07-closed-gate" style="--scene-width:100%;--pause:133.33cqw"><img src="art/07-closed-gate.png" width="889" height="1769" alt="TWO very unequal silent shots after the clerk&#x27;s answer: upper tall borderless view of a shut pale stone return portal recessed under sandstone ribs, inert and dark, with Kou small at its foot; lower narrow closeup of Kou&#x27;s empty open hand relaxing into a tense fist. No magical portal opening, no code, no modern phone, no proof of why it is shut.  効果音「グッ」：Kou tightens his fist"></figure><figure class="scene conversation align-center" id="08-hungry-walk" style="--scene-width:100%;--pause:46.15cqw"><img src="art/08-hungry-walk-context.png" width="887" height="1774" alt="THREE unequal successive CLOSEUPS after Kou leaves stall and sees shut gate. Top his hand opens EXISTING rectangular brown LEATHER TOOL SATCHEL at belt, sees worn trowel handle, small notebook and string; not coin purse. Middle boot steps on tower paving. Bottom larger hand on stomach under cream shirt and green apron. Single thought belongs to TOP tool shot. NO wallet, coin purse, money, phone, meal or Elna. Ivory space around asymmetrical hand and boot panels. コウ・心「道具しか、ない。」 効果音「コツ」：Kou boot on paving 効果音「ぐう……」：Kou stomach"></figure><figure class="scene continuous align-center" id="09-steam-trail" style="--scene-width:100%;--pause:61.54cqw"><img src="art/09-steam-trail.png" width="724" height="2172" alt="ONE long borderless vertical composition, portrait approximately 1:3, a camera journey rather than a page grid. At the top only a partial open diner window and the cream sleeve of the unseen cook&#x27;s knife hand chopping on a CLEAN kitchen board; warm steam drifts downward through empty ivory space; at the bottom Kou at the lane looks toward the same blue-awning timber diner. Elna&#x27;s face is not shown yet. Garden remains wilted. No harvest of new crops.  効果音「トン、トン」：cook knife tapping chopping board inside window"></figure><figure class="scene conversation align-center" id="03-diner" style="--scene-width:100%;--pause:33.33cqw"><img src="art/03-diner-context.png" width="887" height="1774" alt="THREE unequal shots at BLUE-AWNING diner EXTERIOR. Top medium hesitant Kou RIGHT outside serving window and Elna LEFT inside, he requests WATER ONLY. Middle close Elna notices strained face and gently offers seat. Bottom shallow SILENT shot Kou lowers himself onto OUTDOOR wooden bench at window. No food, work offer, names or extra menu text. Water cup NOT delivered yet. Original identity clothes, no farm tools on food counter. Unequal situation and focused closeups, not identical boxes. コウ「すみません。水を、もらえますか。」 エルナ「大丈夫？　こっちに座って。」 "></figure><figure class="scene conversation align-center" id="38-water-and-thanks" style="--scene-width:100%;--pause:48.72cqw"><img src="art/38-water-and-thanks.png" width="887" height="1774" alt="THREE quiet unequal close shots SAME diner window, Kou seated outside RIGHT, Elna standing inside LEFT. Upper shallow hands: Elna places ONE plain small brown ceramic WATER CUP on counter, clear clean water NOT stew. Her utterance from offscreen, tail UP LEFT toward mouth, not cup. Middle larger SILENT Kou holds SAME cup both hands, drinks slowly. Bottom Kou face with lowered cup gives thanks, shoulders start to release. Elna out of closeup frame, still inside. No food, job, harvest, terms or new cast. エルナ「はい。ゆっくり飲んで。」 コウ「ありがとうございます。」 "></figure><figure class="scene conversation align-center" id="39-cannot-pay" style="--scene-width:100%;--pause:38.46cqw"><img src="art/39-cannot-pay.png" width="887" height="1774" alt="THREE unequal beats SAME window, Kou seated outside RIGHT with brown WATER CUP on counter, Elna inside LEFT. Top medium gentle Elna asks about food. Middle close embarrassed Kou acknowledges no money. Bottom larger close Kou shoulder and hand near cup politely declines to avoid imposing; Elna may be offscreen. SMALL stomach sound at lower torso, not comedy. No meal served, job promise, bill, magic money, handover or bargaining. Keep cup SAME size brown shape. エルナ「何か、食べる？」 コウ「……今、お金がなくて。」 コウ「水だけで、大丈夫です。」 効果音「ぐう…」：Kou stomach under counter"></figure><figure class="scene conversation align-right" id="11-farmer-recognized" style="--scene-width:100%;--pause:23.08cqw"><img src="art/11-farmer-recognized-context.png" width="1024" height="1536" alt="Two unequal recognition shots at same diner window. Kou remains seated outside on RIGHT with the brown water cup; Elna stands inside on LEFT. Upper medium Elna notices his work clothes and tool satchel, asks about farming. Lower larger seated Kou answers. No dirty tool held or placed on food counter, no location change, no diagnosis or work agreement yet. エルナ「その服、農家なの？」 コウ「七年、野菜を作ってました。」 "></figure><figure class="scene conversation align-center" id="40-work-offer" style="--scene-width:100%;--pause:43.59cqw"><img src="art/40-work-offer.png" width="887" height="1774" alt="THREE unequal beats AFTER Elna learns Kou is farmer with seven years experience. SAME diner exterior window. Upper medium Elna LEFT inside leans to point toward WILTED garden RIGHT of diner, worried request; Kou RIGHT outside still seated, looks where she points. Middle larger close sincere Elna face proposes one meal for LOOKING at plot, no cure guarantee. Bottom close tentatively hopeful Kou agrees politely, shoulder-turn prepares to stand, NOT already at roots. No finished drain, cured plants, meal, money, contract or UI. Farm tools remain at belt, no tools on counter. Large vertical glyphs, one utterance per downward shot. エルナ「裏の畑、困ってるの。」 エルナ「見てくれたら、一食出すよ。」 コウ「僕でよければ、見せてください。」 "></figure><figure class="scene continuous align-center" id="12-garden-walk" style="--scene-width:100%;--pause:28.21cqw"><img src="art/12-garden-walk.png" width="725" height="2170" alt="ONE borderless vertical camera journey from the blue diner awning at the upper-left along the narrow stone side path toward wilted garden beds to the right. Elna leads, Kou follows; below, the reader sees wet paving, boots at the edge and sagging leaves. Keep plants rooted, yellow-green and wilted, no healthy regrowth. The paved lane is left and garden right, under tower ceiling, no outdoor sky.  効果音「ぱちゃ」：Kou boot meets small puddle on path"></figure><figure class="scene varied align-center" id="04-wet-soil" style="--scene-width:100%;--pause:20.51cqw"><img src="art/04-wet-soil-lettered.png" width="887" height="1774" alt="Three unequal panels in the same plot: wide Elna left and crouching Kou right beside wilted broad leafy vegetables; closeup her tense hand holding a small fertilizer sack closed; lower closeup Kou pressing moist soil, not pouring water. Water remains pooled, drain is still blocked. エルナ「水も肥料も、増やしたのに。」 コウ「この土、ずっと湿ってる？」 "></figure><figure class="scene detail align-left" id="14-surface-and-depth" style="--scene-width:100%;--pause:20.51cqw"><img src="art/14-surface-and-depth.png" width="887" height="1774" alt="THREE unequal diagnostic closeups in SAME wilted garden: top shallow closeup of dry crumbly top skin; middle larger Kou&#x27;s fingers press below it and reveal wet dark soil sticking together; bottom Elna&#x27;s worried face while holding the CLOSED small fertilizer sack. No watering action, root pulling or instant cure. Kou remains crouched beside Elna. コウ「乾いてるのは、表面だけ。」 エルナ「朝も、水をやった。」 効果音「むに」：wet soil compressed gently between fingers"></figure><figure class="scene conversation align-right" id="15-one-plant-permission" style="--scene-width:100%;--pause:15.38cqw"><img src="art/15-one-plant-permission.png" width="887" height="1774" alt="TWO quiet medium closeups before the root inspection. Kou is crouching with a hand trowel beside one wilted plant still ROOTED, pointing to that single plant; Elna agrees with a hesitant face. No already extracted plant, no removal before permission. Garden architecture and closed fertilizer sack continue. コウ「一株、見てもいい？」 エルナ「……うん。」 "></figure><figure class="scene detail align-center" id="05-roots" style="--scene-width:100%;--pause:30.77cqw"><img src="art/05-roots-lettered.png" width="887" height="1774" alt="Two medium panels with a narrow hand closeup between: Kou gently exposes one small plant&#x27;s roots with a trowel; dark compact wet root zone and some damaged roots, no instant healthy glow; Elna silently watches and responds to his cautious expression. Exactly one dug plant, nearby plants remain rooted. コウ「葉より先に、根を見たい。」 コウ「悪い場所も、残して比べよう。」 "></figure><figure class="scene detail align-left" id="17-roots-and-air" style="--scene-width:100%;--pause:46.15cqw"><img src="art/17-roots-and-air.png" width="887" height="1774" alt="TWO unequal panels following the existing root inspection: upper large precise closeup of the SAME one small wilted leafy plant held gently, wet compact dark soil on damaged brown roots; lower shoulder-view of Kou explaining briefly while Elna listens. No magical glow, no healthy bright roots or revived leaves. Only this one plant is uprooted, others remain in beds. コウ「根にも、空気が要る。」 効果音「ぽと」：one muddy water droplet falling off exposed soil"></figure><figure class="scene conversation align-right" id="18-elna-guilt" style="--scene-width:100%;--pause:66.67cqw"><img src="art/18-elna-guilt.png" width="887" height="1774" alt="TWO uneven emotional shots in the same plot: upper large close face of Elna, headscarf and lower ponytail, holding her small CLOSED fertilizer sack against chest, ashamed but capable; lower off-center close face of Kou with patient expression looking toward path drain, no accusation. Wilted plants stay wilted. No new person. エルナ「助けたくて、足したの。」 コウ「まず、出口を見よう。」 "></figure><figure class="scene continuous align-center" id="19-follow-water" style="--scene-width:100%;--pause:35.90cqw"><img src="art/19-follow-water.png" width="724" height="2172" alt="ONE tall borderless approximately 1:3 vertical camera journey, showing wet soil at garden edge near top, a small stagnant trickle reaching downward between stone edging and wet footprints, then a wooden inspection lid partly entering the bottom. No opened lid, no litter yet revealed, no repaired strong flow. People mostly offscreen, only Kou&#x27;s brown boot and pointed hand guide observation. Plot to right, side path to left.  効果音「ぴちょ…」：drop from saturated soil falling into stagnant edge puddle"></figure><figure class="scene conversation align-center" id="06-permission" style="--scene-width:100%;--pause:15.38cqw"><img src="art/06-permission-lettered.png" width="887" height="1774" alt="Three unequal conversation panels at removable wooden drain inspection cover near plot edge: Kou asks while pointing at cover; Elna with diner blue awning behind answers; their hands reach for the same cover after permission. Drain not flowing yet, leaves and silt block its opening. コウ「この出口、誰が管理してる？」 エルナ「店の区画は、私が掃除する決まり。」 コウ「開けてもいい？」 エルナ「うん。お願い。」 "></figure><figure class="scene detail align-right" id="21-lift-cover" style="--scene-width:94%;--pause:12.82cqw"><img src="art/21-lift-cover.png" width="887" height="1774" alt="THREE small quick asymmetric action shots after permission. RIGHT upper shot: Kou pulls the iron ring on the wooden inspection lid with his dirty hand. CENTER lower shot: Elna lifts the SAME rectangular wooden lid by the edge with both hands. LEFT lowest shot: she rests the lid upright safely on paving. The open channel is still blocked with packed wet leaves, no flowing water yet. No digging or breaking sandstone.  効果音「ギィッ」：wooden lid lifted 効果音「コトッ」：wooden lid rests on paving"></figure><figure class="scene detail align-left" id="22-blocked-outlet" style="--scene-width:100%;--pause:20.51cqw"><img src="art/22-blocked-outlet.png" width="887" height="1774" alt="THREE unequal observations of the SAME open inspection channel. Upper precise closeup of a compact mat of leaves and mud wedged at accessible mouth of shallow stone outlet; middle Kou crouches and points without removing it; lower small Elna looks at his pointing hand. Stagnant water is upstream of the mat, downstream still only damp. Elna keeps the lid aside upright. No drained bed or lush plants. コウ「ここで、止まってる。」 "></figure><figure class="scene varied align-center" id="23-check-receiver" style="--scene-width:100%;--pause:30.77cqw"><img src="art/23-check-receiver.png" width="887" height="1774" alt="ONE large wide situation panel within a tall portrait field, with a smaller downward eye-line inset: Kou follows the shallow downstream stone channel toward the OPEN common receiver beside the lane. The downstream path is unobstructed and not overflowing. He checks before clearing the upstream blockage. Elna remains nearby holding/resting the cover aside, not vanished or at another location. No water gush yet, no structural excavations. コウ「先の水路は、空いてる。」 "></figure><figure class="scene detail align-left" id="24-clear-litter" style="--scene-width:100%;--pause:10.26cqw"><img src="art/24-clear-litter.png" width="887" height="1774" alt="THREE tight quick diagonally bordered action closeups, all upright lettering: top-right Kou&#x27;s small hand trowel scrapes packed wet leaf litter; middle-left his hand transfers removed litter into an ordinary dirty garden bucket on paving; lower wide hand closeup loosens the remaining small twig at the outlet. Elna helps hold the lid aside. The last obstruction remains, so water is not yet gushing. No clean food bowl, no fertilizer applied. コウ「あと、少し。」 効果音「べちゃ」：wet leaves land in dirty utility bucket"></figure><figure class="scene continuous align-right" id="25-water-tremor" style="--scene-width:86%;--pause:102.56cqw"><img src="art/25-water-tremor.png" width="887" height="1774" alt="One spare macro closeup of a tiny air bubble at the open still-partly-blocked stone outlet near the upper fifth, no people and no lid across the channel. ゴ…… lies beside the bubble. Fade to quiet pale ivory below the upper third; no released stream yet.  効果音「ゴ……」：air and water shifting under the loosened leaf mat"></figure><figure class="scene continuous align-center" id="07-flow" style="--scene-width:100%;--pause:35.90cqw"><img src="art/07-flow-repaired.png" width="887" height="1774" alt="One tall flowing composition plus two small unequal hand closeups at the top: Kou removes leaf litter and silt from accessible outlet, Elna holds lifted cover aside; clear visible flow then follows the channel downward and out safely to common drain. No digging through structural wall, no flooding other houses, wilted plants remain wilted. The visible action causes the flow.  効果音「ごぼっ」：
