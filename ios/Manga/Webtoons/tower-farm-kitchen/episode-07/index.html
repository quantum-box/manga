<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第7話 収穫日は、約束できるか｜塔の農夫は、英雄を食わせる</title><link rel="stylesheet" href="reader.css"></head><body><main><header><span class="series-title">塔の農夫は、英雄を食わせる</span><p>第7話</p><h1>収穫日は、約束できるか</h1><small>21〜28日目</small></header><figure class="scene conversation" id="01-leon" style="--pause:25.64cqw"><img src="art/01-leon.png" width="887" height="1774" alt="Leon enters diner in navy cloak, scar on right eyebrow, no sword, supply notebook in hand; Elna and Kou behind counter listen. Two panels wider arrival then restrained serious face. レオン「次の遠征に、二十食頼めるか。」 レオン「決まった日に、同じ品質で。」"></figure><figure class="scene conversation" id="02-forecast" style="--pause:23.08cqw"><img src="art/02-forecast.png" width="887" height="1774" alt="Kou looks toward small green plot hopefully, Iris beside him holds observation notebook, medium face then narrow hand closeup calendar sketch. No harvested basket, plants still growing. コウ「庭葉は、そろそろ採れるはず。」 イリス「その『はず』、どこまで確か？」"></figure><figure class="scene varied" id="03-shade" style="--pause:20.51cqw"><img src="art/03-shade.png" width="887" height="1774" alt="Same bed has visibly shadier corner under tower rib, plants in that section smaller; Balt points upward at shadow boundary, Kou measures a leaf gently. Two unequal closeups and one contextual view. コウ「この列は、まだ小さい。」 バルト「光が違う。日付だけじゃ読めん。」"></figure><figure class="scene detail" id="04-recalculate" style="--pause:33.33cqw"><img src="art/04-recalculate.png" width="887" height="1774" alt="Kou and Elna at table with crop notebook, crossed-out estimate and alternative schedule shown only as abstract marks, closeup uncertain thoughtful Kou then Elna listening. No false exact harvest-day projection. コウ「二十八日は、見込みだった。」 コウ「遅れた場合も、計算し直す。」"></figure><figure class="scene conversation" id="05-decline" style="--pause:25.64cqw"><img src="art/05-decline.png" width="887" height="1774" alt="Three unequal conversation panels at diner: Kou honest serious, Leon watching without anger, Elna anxious then relieved. No humiliation or cartoon villain stance. コウ「二十食は、まだ約束できません。」 レオン「出せる数と、代わりの手を聞こう。」"></figure><figure class="scene varied" id="06-backup" style="--pause:17.95cqw"><img src="art/06-backup.png" width="887" height="1774" alt="Elna negotiates with local produce supplier at back door, Balt nearby discusses existing stock, Kou checks ledger. Baskets represent supplier&#x27;s mature crops, not main plot magically grown. エルナ「足りない分は、買える。」 コウ「量と値段も、先に決めよう。」"></figure><figure class="scene detail" id="07-thin" style="--pause:21.79cqw"><img src="art/07-thin-sequence-fixed.png" width="887" height="1774" alt="Two closeups and quiet medium panel: Kou carefully thins crowded SMALL garden-leaf seedlings, Elna holds tray for removed seedlings away from future food; path not trodden over bed. No harvesting immature plants for order. コウ「今日は、この苗を間引く。」 バルト「育つ場所を、残してやれ。」"></figure><figure class="scene hero" id="08-small-contract" style="--pause:46.15cqw"><img src="art/08-small-contract.png" width="887" height="1774" alt="Large dignified scene in diner: Leon offers small plain contract, Kou and Elna accept together, modest vegetable beds seen outside. Hands coherent, no ornate reward trophy or huge coin shower. レオン「まず、一便だけ。十二食だ。」 コウ「畑も、仕入れも確認します。」"></figure><footer><p>第7話 おわり</p><nav><a href="../episode-06/index.html">前の話</a><a class="series-index" href="../chapters.html">話一覧</a><a href="../episode-08/index.html">次の話</a></nav></footer></main><script>if(window.webkit?.messageHandlers?.mangaReader)document.querySelector('.series-index')?.remove();</script></body></html>
