</style><main class="episode"><header><p class="eyebrow">武侠転生譚 ／ 白嶺門</p><h1>剣聖、<br>仇の弟子に<br>転生する</h1><p class="subtitle">第1話　その手は、二度目</p><p class="eyebrow">下へスクロール ↓</p></header>
<p class="line">剣聖と呼ばれた俺は、<br>この夜、死んだ。</p>
<figure class="scene" id="death"><img src="art/01-death.png" width="1024" height="1536" alt="白髪の凌雪の胸を、顔の見えない男の剣が貫く"><p class="thought" style="top:74%;right:7%">この手だけは、<br>忘れない。</p></figure>
<div class="pause" style="--pause:160px"></div><p class="line">……なのに。</p>
<p class="line">……俺の、手？</p>
<figure class="scene" id="awake"><img src="art/02-awake.png" width="1024" height="1536" alt="黒髪の阿澄が目覚める。震える手から木剣が落ち、膝をつく"><p class="sound" style="top:55%;right:8%">かたっ</p><p class="thought" style="top:83%;right:5%">剣さえ、<br>握れない。</p></figure>
<p class="label">白嶺門・末席の弟子　阿澄（あちょう）</p>
<p class="line">胸の傷はない。<br>記憶だけが、残っている。</p>
<div class="pause" style="--pause:120px"></div>
<figure class="scene steps" id="steps"><img src="art/03-steps.png" width="724" height="2172" alt="白い霧、霜の石段、下へ続く足跡。最後に墨緑の裾と黒い靴だけが近づく"><p class="bubble" id="voice" style="top:4%;right:7%">阿澄。<br>立てるか。</p><p class="thought" id="voice-question" style="top:20%;left:7%">この声……</p><p class="sound" style="top:57%;right:15%;writing-mode:vertical-rl">こつ</p><p class="sound" id="last-step" style="top:80%;left:16%;writing-mode:vertical-rl">こつ</p></figure>
<div class="pause" id="before-face" style="--pause:clamp(350px,100cqw,480px)"></div>
<figure class="scene portrait" id="face-reveal"><img src="art/04-master.png" width="1024" height="1536" alt="仇の沈玄の顔が初めて現れる。黒い結び髪と短い髭、墨緑の衣と黒い肩衣"><p class="thought" style="top:71%;left:6%">沈玄。<br>俺を殺した男。</p></figure>
<p class="line quiet">……今は、こいつの弟子か。</p><p class="line">なら、誰より近くで<br>復讐できる。</p><div class="pause" style="--pause:160px"></div>
<p class="line">まずは、この身体だ。<br>一寸だけなら――</p>
<figure class="scene" id="technique"><img src="art/05-technique.png" width="1024" height="1536" alt="木剣のごく小さな一振り。紅葉が二つに割れ、阿澄の目が警戒へ変わる"><p class="thought" style="top:9%;left:6%">力は、要らない。</p><p class="sound" style="top:65%;right:7%">すっ</p></figure>
<p class="line">……斬れた。</p><p class="line">まずい。<br>これは、俺の剣筋だ。</p>
<figure class="scene" id="shield"><img src="art/06-shield.png" alt="暗器が落ち、沈玄が左腕で阿澄をかばう。一本の針が袖を貫く"><p class="bubble" style="top:17%;left:6%">伏せろ！</p><p class="sound" style="top:43%;right:6%">ざっ</p></figure>
<p class="line" id="protected-question">なぜ……俺を守る？</p>
<div class="pause" id="after-rescue" style="--pause:clamp(500px,150cqw,720px)"></div>
<p class="line">俺は、お前を<br>殺すつもりなのに。</p>
<figure class="scene" id="warning"><img src="art/07-warning.png" alt="沈玄の左腕には針が残る。師匠が阿澄にだけ囁く"><p class="bubble" id="warning-line" style="top:31%;right:5%">その剣を、二度と<br>人前で使うな。</p></figure>
<div class="pause" id="before-confession" style="--pause:clamp(700px,200cqw,960px)"></div>
<p class="last" id="confession">「今度こそ、<br>お前を死なせない。」</p>
<div class="pause" style="--pause:230px"></div>
<section class="ending"><p>……今度こそ？</p><footer>第1話 終 ／ 第2話へ続く</footer></section></main></html>
