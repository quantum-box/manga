<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>天魔、二周目。 第8話 百人分の盾になれ</title><link rel="stylesheet" href="reader.css"></head><body><main class="episode"><header><p class="eyebrow">武侠 × 異世界転生 × 強くてニューゲーム</p><h1>天魔、<br><span>二周目。</span></h1><p class="subtitle">第8話　百人分の盾になれ</p><p class="hint">下へスクロール ↓</p></header><p class="transition" style="font-size:19px;line-height:1.9;padding:24px 8%;margin:0">夜が明けても、命令は止まらない。</p><figure class="scene" id="scene-1" data-vignettes="4" data-source="art/01.png" data-window="[0, 2172]"><img src="art/01.png" width="724" height="2172" alt="人形にしない。ハン・ユン「斬るな。まだ、生きてる。」。ハン・ユン「白燼と、同じ印だ。」。ソ・リン「動ける人は、こっち！」。白燼「一人も、置いていくな。」。" decoding="sync"></figure><div class="pause" id="pause-scene-4" style="height:61.5385cqw" data-purpose="退避を続けながら一人で防げない範囲を確かめ、仲間に頼る理由を作る" aria-hidden="true"></div><figure class="scene" id="scene-4" data-vignettes="4" data-source="art/04-pacing-v2.png" data-window="[0, 2172]"><img src="art/04-pacing-v2.png" width="724" height="2172" alt="守る場所を決める。ハン・ユン「両方には、手が届かない。」。ソ・リン「出口は、工房の裏！」。白燼「こっちは、俺が見る。」。ハン・ユン「一人で、抱えなくていい。」。" decoding="sync"></figure><div class="pause" id="pause-scene-2" style="height:94.8718cqw" data-purpose="第5話の称号を救助へ回収する" aria-hidden="true"></div><figure class="scene" id="scene-2" data-vignettes="4" data-source="art/02.png" data-window="[0, 2172]"><img src="art/02.png" width="724" height="2172" alt="百人の力。システム「百人の統率者。護陣　使用可能」。槍の王「今度は、俺たちも使え。」。ハン・ユン「力を貸して。守るために。」。ハン・ユン「百人分の、盾になれ。」。" decoding="sync"></figure><div class="pause" id="pause-scene-3" style="height:166.6667cqw" data-purpose="生還への反応を先に置いてから門へ進む" aria-hidden="true"></div><figure class="scene" id="scene-3" data-vignettes="4" data-source="art/03.png" data-window="[0, 2161]"><img src="art/03.png" width="728" height="2161" alt="救ったあとの手。ハン・ユン「痛むところ、ある？」。ソ・リン「助けたんだよ。ちゃんと。」。ハン・ユン「……よかった。」。システム「帰還門　起動」。" decoding="sync"></figure><div class="
