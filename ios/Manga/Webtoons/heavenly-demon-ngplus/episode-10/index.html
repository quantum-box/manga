 id="pause-scene-3-return" style="height:112.8205cqw" data-purpose="生きて帰る目的を果たし仲間へ自分で戻る" aria-hidden="true"></div><p class="transition" style="font-size:19px;line-height:1.9;padding:24px 8%;margin:0">翌朝。休んでから、持っていくものを選んだ。<br>今度は、助けを待つためではなく、会いに行く。</p><figure class="scene" id="scene-3-return" data-vignettes="2" data-source="art/03.png" data-window="[796, 2172]"><div class="art-window" style="aspect-ratio:724/1376"><img src="art/03.png" width="724" height="2172" alt="二つの暮らし。ソ・リン「おかえり。早かったね。」。ハン・ユン「二周目は、俺が決める。」。" style="object-position:50% 100.000000%" decoding="sync"></div></figure><div class="pause" style="height:65cqw" aria-hidden="true" data-purpose="余韻から次話へ"></div><footer><p>第10話 完</p><p>第一部 完</p><nav class="chapter-links" aria-label="話を移動"><a href="../episode-09/index.html">← 第9話</a><a href="../serial.html">話一覧</a></nav><small>天魔、二周目。 ／ ORIGINAL WEBTOON</small></footer></main></body></html>
