<figure id="scene-01"><img src="art/01.png" width="887" height="1774" alt="工房街の夜。翌日のログイン、工房へ向かう同じ街路。灯りの消えた夜。カイ「こっちの通りだけだ。」 オルン「灯炉が止まった。」 オルン「製作台も動かん。」 カイ「直せるの？」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
<figure id="scene-02"><img src="art/02-night.png" width="887" height="1774" alt="残す部品。同じ工房の入口、オルンの木の机。オルン「旧水路に、蓄積環がある。」 オルン「壊さず持ち帰れ。」 セナ「倒すだけじゃ、だめか。」 HUD「復旧期限　３日」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:20.513cqw"></div>
<figure id="scene-03"><img src="art/03-night.png" width="887" height="1774" alt="魔法使いの参加。同じ机、イリスは扉から入る。イリス「私も、手伝う。」 カイ「イリス、来てたんだ。」 イリス「魔力の記録は任せて。」 セナ「三人で、試してみよう。」。会話は縦書きの吹き出しとして画像に含む。"></figure>
<div class="gap" aria-hidden="true" style="--gap:15.385cqw"></div>
